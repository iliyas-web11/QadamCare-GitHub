              <select id="clinicRegionSel">${REGIONS_KZ.map(r => `<option value="${r.id}" ${r.id === state.clinicRegion ? "selected" : ""}>${escapeHTML(r[state.lang])}</option>`).join("")}</select>
            </div>
            <div>
              <label class="field-label" for="clinicProfileSel">${escapeHTML(t("lblProfFilter"))}</label>
              <select id="clinicProfileSel">${Object.keys(t("profOpts")).map(k => `<option value="${k}" ${k === state.clinicProfile ? "selected" : ""}>${escapeHTML(t("profOpts." + k))}</option>`).join("")}</select>
            </div>
          </div>
          <div class="grid-2">
            ${matches.length === 0 ? `<div class="card clinic-empty" role="status">${escapeHTML(u("noVerifiedVR"))}</div>` : ""}
            ${matches.map(c => {
              const regObj = REGIONS_KZ.find(r => r.id === c.region);
              return `<div class="kpi-card">
                <div style="font-weight:700;color:var(--primary);margin-bottom:0.35rem;">${escapeHTML(c.name[state.lang])}</div>
                <div class="row-flex" style="gap:0.35rem;margin-bottom:0.4rem;">
                  <span class="badge badge-muted">${escapeHTML(regObj ? regObj[state.lang] : c.region)}</span>
                  <span class="badge badge-vr">${escapeHTML(u("confirm"))}</span>
                </div>
                <div class="muted" style="font-size:0.84rem;margin-bottom:0.45rem;">${c.profiles.map(p => escapeHTML(t("profOpts." + p)) + (p === "vr" ? " — " + escapeHTML(u("confirm")) : "")).join(" · ")}</div>
                <a href="${c.url}" target="_blank" rel="noopener noreferrer" style="font-size:0.86rem;font-weight:600;">${escapeHTML(t("officialSource"))} ↗</a>
              </div>`;
            }).join("")}
          </div>
          <p class="muted" style="margin-top:0.85rem;margin-bottom:0;">${escapeHTML(t("clinicContactNote"))}</p>
        </div>
      `;

      $("routeGoalSel").addEventListener("change", e => { state.routeGoal = Number(e.target.value); renderTabContent(); });
      $("visitTypeSel").addEventListener("change", e => { state.visitType = Number(e.target.value); renderTabContent(); });
      $("hadSurgeryChk").addEventListener("change", e => { state.hadSurgery = e.target.checked; renderTabContent(); });
      el.querySelectorAll(".doc-chk").forEach(chk => chk.addEventListener("change", e => { state.checkedDocs[e.target.dataset.dk] = e.target.checked; }));
      $("clinicRegionSel").addEventListener("change", e => { state.clinicRegion = e.target.value; renderTabContent(); });
      $("clinicProfileSel").addEventListener("change", e => { state.clinicProfile = e.target.value; renderTabContent(); });
      return;

      const noteText = buildDamumedNote(pid);
      el.innerHTML = `
        <div class="card">
          <h3>${escapeHTML(t("reportTitle"))}</h3>
          ${summaryMarkup(generateSummaryText(pid))}
          <div class="row-flex">
            <button type="button" class="btn-primary" id="btnPrintPdf">${escapeHTML(t("btnHtmlReport"))}</button><button type="button" class="btn-secondary" id="btnExpHtml">${escapeHTML(t("btnDownloadHtml"))}</button>
            <button type="button" class="btn-secondary" id="btnExpCsv">${escapeHTML(t("btnCsvExport"))}</button>
          </div>
        </div>

        ${!isParent ? `
          <div class="card">
            <h3>${escapeHTML(t("damumedTitle"))}</h3>${summaryMarkup(t("integrationNote"))}
            <textarea id="damumedNoteArea" rows="8" readonly style="font-family:monospace;font-size:0.85rem;background:#F8FAFC;">${escapeHTML(noteText)}</textarea>
            <div class="row-flex" style="margin-top:0.7rem;">
              <button type="button" class="btn-primary btn-sm" id="btnCopyDamumed">${escapeHTML(t("btnCopyNote"))}</button>
              <button type="button" class="btn-vr btn-sm" id="btnExpFhir">${escapeHTML(t("btnFhir"))}</button>
            </div>
          </div>` : ""}

        <div class="card">
          <h3>${escapeHTML(t("ethicsFullTitle"))}</h3>
          <p style="white-space:pre-wrap;margin:0;">${escapeHTML(t("ethicsFullText"))}</p>
        </div>
      `;

      $("btnPrintPdf").addEventListener("click", () => printPatientReport(pid));
      $("btnExpHtml").addEventListener("click", () => exportHTMLReport(pid));
      $("btnExpCsv").addEventListener("click", () => exportCSVTable(pid));
      if (!isParent) {
        $("btnCopyDamumed").addEventListener("click", () => {
          const ta = $("damumedNoteArea");
          ta.select();
          document.execCommand("copy");
          showToast(t("toastCopied"));
        });
        $("btnExpFhir").addEventListener("click", () => exportFHIRJson(pid));
      }
      return;
    }

    if (state.activeTab === "ml") {
      const cohort = computeCohortStats();
      const ml = runGroupKFoldML();
      const best = ml?.models[0];

      el.innerHTML = `
        <div class="card">
          <h3>${escapeHTML(t("mlCohortTitle"))}</h3>
          <div class="grid-3">
            <div class="kpi-card"><div class="kpi-title" style="color:var(--vr);">VR > Verbal</div><div class="kpi-val">${cohort.vrBetter} / ${cohort.total}</div><div class="kpi-sub">${((cohort.vrBetter / Math.max(1, cohort.total)) * 100).toFixed(1)}%</div></div>
            <div class="kpi-card"><div class="kpi-title" style="color:var(--verbal);">Verbal > VR</div><div class="kpi-val">${cohort.verbalBetter} / ${cohort.total}</div><div class="kpi-sub">${((cohort.verbalBetter / Math.max(1, cohort.total)) * 100).toFixed(1)}%</div></div>
            <div class="kpi-card"><div class="kpi-title" style="color:var(--baseline);">${escapeHTML(u("minimal"))} (≤${state.cohortThreshold ?? 0.35}°)</div><div class="kpi-val">${cohort.minimal} / ${cohort.total}</div><div class="kpi-sub">${((cohort.minimal / Math.max(1, cohort.total)) * 100).toFixed(1)}%</div></div>
          </div>
        </div>

        ${ml ? `
          <div class="card">
            <h3>${escapeHTML(t("mlEngineTitle"))}</h3>
            <p class="muted">${escapeHTML(t("mlRandomBase"))} · ${escapeHTML(u("subject"))}: ${ml.patientsCount} · ${escapeHTML(u("folds"))}: ${ml.folds}</p>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Model</th><th>Accuracy (mean ± SD)</th><th>Macro-F1 (mean ± SD)</th></tr></thead>
                <tbody>
                  ${ml.models.map(m => `<tr><td><strong>${escapeHTML(m.name)}</strong></td><td>${(m.accMean * 100).toFixed(1)}% ± ${(m.accSd * 100).toFixed(1)}%</td><td>${m.f1Mean.toFixed(3)} ± ${m.f1Sd.toFixed(3)}</td></tr>`).join("")}
                </tbody>
              </table>
            </div>
            <p class="muted" style="margin-top:0.75rem;margin-bottom:0;">${escapeHTML(t("mlScienceNote"))}</p>
          </div>

          <div class="grid-2">
            <div class="card">
              <h3>${escapeHTML(t("cmTitle"))}</h3>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>True \\ Pred</th><th>Baseline</th><th>Verbal</th><th>VR</th></tr></thead>
                  <tbody>
                    ${CONDITIONS.map((c, i) => `<tr><th>${c}</th><td>${best.cm[i][0]}</td><td>${best.cm[i][1]}</td><td>${best.cm[i][2]}</td></tr>`).join("")}
                  </tbody>
                </table>

            <div class="card">
              <h3>${escapeHTML(t("fiTitle"))}</h3>
              ${ml.featureImportance.map(f => `
                <div style="margin-bottom:0.55rem;">
                  <div class="row-flex" style="justify-content:space-between;font-size:0.86rem;">
                    <span>${escapeHTML(t("metrics." + f.col))}</span>
                    <strong>${f.pct.toFixed(1)}%</strong>
                  </div>
                  <div style="height:8px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin-top:3px;">
                    <div style="height:100%;width:${f.pct.toFixed(1)}%;background:var(--primary);"></div>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>` : ""}
      `;
    }
  }

  function renderAIChat() {
    $("aiChatPanel").classList.toggle("hidden", !state.chatOpen);
    $("aiChatTitle").textContent = t("aiTitle");
    $("aiChatSub").textContent = t("aiSubOffline");
    $("aiChatInput").placeholder = t("aiPlaceholder");
    $("aiSendBtn").textContent = t("aiSend");

    $("aiQuickBar").innerHTML = t("aiQuickQs").map((q, idx) =>
      `<button type="button" class="ai-quick-chip" data-qidx="${idx}">${escapeHTML(q)}</button>`
    ).join("");
    $("aiQuickBar").querySelectorAll(".ai-quick-chip").forEach(btn => {
      btn.addEventListener("click", () => handleAISend(t("aiQuickQs")[Number(btn.dataset.qidx)], Number(btn.dataset.qidx)));
    });

    const box = $("aiMessages");

  function initDraggableFAB() {
    const fab = $("aiFab");
    const panel = $("aiChatPanel");
    let dragging = false, moved = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
    const margin = 16;

    function updatePanelAnchor(isLeft) {
      if (isLeft) {
        panel.style.left = `${margin}px`;
        panel.style.right = "auto";
      } else {
        panel.style.right = `${margin}px`;
        panel.style.left = "auto";
      }
    }

    function snapToEdge() {
      const rect = fab.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const snapLeft = centerX < window.innerWidth / 2;
      const targetLeft = snapLeft ? margin : Math.max(margin, window.innerWidth - fab.offsetWidth - margin);
      const maxT = Math.max(margin, window.innerHeight - fab.offsetHeight - margin);
      const targetTop = Math.max(margin, Math.min(maxT, rect.top));

      fab.classList.add("snapping");
      fab.style.left = `${targetLeft}px`;
      fab.style.top = `${targetTop}px`;
      fab.style.right = "auto";
      fab.style.bottom = "auto";
      updatePanelAnchor(snapLeft);
      setTimeout(() => fab.classList.remove("snapping"), 360);
    }

    fab.addEventListener("pointerdown", e => {
      dragging = true;
      moved = false;
      fab.classList.remove("snapping");
      const rect = fab.getBoundingClientRect();
      startX = e.clientX;
      startY = e.clientY;
      origLeft = rect.left;
      origTop = rect.top;
      fab.setPointerCapture(e.pointerId);
    });

    fab.addEventListener("pointermove", e => {
      if (!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
      if (!moved) return;
      const maxL = window.innerWidth - fab.offsetWidth - 8;
      const maxT = window.innerHeight - fab.offsetHeight - 8;
      const newL = Math.max(8, Math.min(maxL, origLeft + dx));
      const newT = Math.max(8, Math.min(maxT, origTop + dy));
      fab.style.left = `${newL}px`;
      fab.style.top = `${newT}px`;
      fab.style.right = "auto";
      fab.style.bottom = "auto";
    });

    fab.addEventListener("pointerup", e => {
      if (!dragging) return;
      dragging = false;
      fab.releasePointerCapture(e.pointerId);
      if (moved) {
        snapToEdge();
      } else {
        state.chatOpen = !state.chatOpen;
        renderAIChat();
      }
    });

    window.addEventListener("resize", () => {
      if (fab.style.left) snapToEdge();
    });
  }

  parseCSVText=function(text,file='CSV'){

}

const at=k=>anatomyText[k][{kk:0,ru:1,en:2}[state.lang]];
const anatomyState={condition:'Baseline',rotate:true,blob:null,load:null,status:'idle'};
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
async function prepareAnatomy(){
 if(location.protocol==='file:'){anatomyState.status='error';return false;}
 if(anatomyState.blob&&customElements.get('model-viewer'))return true;
 if(anatomyState.load)return anatomyState.load;
 anatomyState.status='loading';
 anatomyState.load=(async()=>{try{
   const response=await fetch('./models/skeleton.glb');if(!response.ok)throw new Error('model unavailable');
   const bytes=await response.arrayBuffer();if(bytes.byteLength<20||new DataView(bytes).getUint32(0,true)!==0x46546c67)throw new Error('invalid GLB');
   await import('https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js');
   anatomyState.blob=URL.createObjectURL(new Blob([bytes],{type:'model/gltf-binary'}));anatomyState.status='ready';return true;
 }catch(e){anatomyState.status='error';return false;}})();return anatomyState.load;
}
function anatomyReadouts(card){const pid=state.user&&state.selectedPatient,stats=pid&&state.dataLoaded?getPatientStats(pid):null,flags=stats?detectCompensations(pid):[],cond=anatomyState.condition;
 const joints=[['hip','GVS_aSagH'],['knee','GVS_aSagK'],['ankle','GVS_aSagA']];
 card.querySelector('.joint-readouts').innerHTML=joints.map(([joint,m])=>{const value=stats?.[cond]?.metrics[m]?.mean,flag=flags.some(f=>f.cond===cond&&f.metric===m),label=at(joint)+' · '+(value==null?at('noData'):fmt(value)+'°');const spot=card.querySelector('[data-joint="'+joint+'"]');if(spot){spot.textContent=label;spot.classList.toggle('flagged',flag);spot.title=flag?at('flag'):at('noflag');spot.setAttribute('aria-label',label+'. '+spot.title);}return `<div class="joint-readout ${flag?'flagged':''}"><span>${at(joint)}</span><strong>${value==null?'—':fmt(value)+'°'}</strong><span>${flag?at('flag'):(stats?cond:at('noData'))}</span></div>`;}).join('');
 card.querySelectorAll('[data-condition]').forEach(b=>{b.classList.toggle('active',b.dataset.condition===cond);b.setAttribute('aria-pressed',String(b.dataset.condition===cond));});
}
function anatomyMotion(){document.querySelectorAll('.anatomy-viewer').forEach(v=>v.toggleAttribute('auto-rotate',anatomyState.rotate&&!reducedMotion.matches&&!document.hidden));document.querySelectorAll('[data-anatomy-rotate]').forEach(b=>{b.textContent=at(anatomyState.rotate&&!reducedMotion.matches?'pause':'rotate');b.disabled=reducedMotion.matches;b.setAttribute('aria-pressed',String(anatomyState.rotate&&!reducedMotion.matches));});}
function anatomyCard(hero=false){const card=document.createElement('section');card.className='card anatomy-card '+(hero?'hero-anatomy':'bento-half');
 card.innerHTML=`<div class="anatomy-header"><div><h3>${at('title')}</h3><p class="muted">${at('subtitle')}</p></div></div><div class="anatomy-controls" role="group" aria-label="${at('condition')}">${CONDITIONS.map(c=>`<button class="btn-secondary btn-sm" data-condition="${c}">${c}</button>`).join('')}</div><div class="anatomy-stage"><div class="anatomy-fallback" role="status"><svg viewBox="0 0 100 150" aria-hidden="true"><g stroke="#087F80" stroke-width="4" fill="none"><circle cx="50" cy="18" r="12"/><path d="M50 30V80M22 42H78M22 42L12 85M78 42L88 85M33 80H67M33 80L30 142M67 80L70 142M25 52Q50 80 75 52M30 44Q50 67 70 44"/></g></svg><p>${at(location.protocol==='file:'?'fallback':'loading')}</p></div></div><div class="anatomy-controls"><button class="btn-secondary btn-sm" data-anatomy-rotate>${at('pause')}</button><button class="btn-secondary btn-sm" data-anatomy-reset>${at('reset')}</button></div><p class="muted">${at('hint')}</p><div class="joint-readouts"></div><p class="anatomy-note">${at('note')}</p>`;
 card.querySelectorAll('[data-condition]').forEach(b=>b.onclick=()=>{anatomyState.condition=b.dataset.condition;document.querySelectorAll('.anatomy-card').forEach(anatomyReadouts);});
 card.querySelector('[data-anatomy-rotate]').onclick=()=>{anatomyState.rotate=!anatomyState.rotate;anatomyMotion();};
 card.querySelector('[data-anatomy-reset]').onclick=()=>{const v=card.querySelector('model-viewer');if(v){v.cameraOrbit='0deg 90deg auto';v.cameraTarget='auto auto auto';v.fieldOfView='30deg';v.resetTurntableRotation();}};
 anatomyReadouts(card);prepareAnatomy().then(ok=>{if(!card.isConnected)return;const stage=card.querySelector('.anatomy-stage');if(!ok){stage.querySelector('p').textContent=at('fallback');card.querySelectorAll('[data-anatomy-rotate],[data-anatomy-reset]').forEach(b=>b.disabled=true);return;}
 const viewer=document.createElement('model-viewer');viewer.className='anatomy-viewer';viewer.setAttribute('alt',at('alt'));viewer.setAttribute('camera-controls','');viewer.setAttribute('disable-pan','');viewer.setAttribute('shadow-intensity','.5');viewer.setAttribute('rotation-per-second','8deg');viewer.setAttribute('interaction-prompt','none');viewer.setAttribute('camera-orbit','0deg 90deg auto');viewer.setAttribute('loading','eager');viewer.setAttribute('ar','false');viewer.removeAttribute('ar');viewer.a11y={front:at('viewfront'),back:at('viewback'),left:at('viewleft'),right:at('viewright')};
 viewer.addEventListener('load',()=>{const d=viewer.getDimensions(),c=viewer.getBoundingBoxCenter(),bottom=c.y-d.y/2;const fractions={hip:.51,knee:.28,ankle:.065};for(const joint of ['hip','knee','ankle']){const spot=document.createElement('button');spot.className='joint-hotspot';spot.slot='hotspot-'+joint;spot.dataset.joint=joint;spot.dataset.position=`${c.x+d.x*.12} ${bottom+d.y*fractions[joint]} ${c.z+d.z*.14}`;spot.dataset.normal='0 0 1';spot.onclick=()=>{card.querySelector('.joint-readouts').scrollIntoView({block:'nearest',behavior:reducedMotion.matches?'auto':'smooth'});};viewer.append(spot);}anatomyReadouts(card);});
 viewer.addEventListener('error',()=>{stage.innerHTML=`<div class="anatomy-fallback" role="status"><p>${at('fallback')}</p></div>`;});stage.replaceChildren(viewer);viewer.src=anatomyState.blob;anatomyMotion();
 });return card;
}
function arrangeBento(){const el=$('tabContent');el.classList.add('bento-layout');el.classList.toggle('gait-bento',state.activeTab==='gait');for(const card of el.children){card.classList.remove('bento-half','bento-third');}
 if(state.activeTab==='gait'&&state.selectedPatient){const cards=[...el.children];const curve=cards.find(c=>c.querySelector('#signalSelect'));if(curve){curve.classList.add('bento-half','gait-curve');curve.after(anatomyCard());}const notices=cards.filter(c=>c.classList.contains('card-warn')||c.classList.contains('card-success'));notices.forEach(c=>el.append(c));}
 if(state.activeTab==='summary'){[...el.children].slice(0,2).forEach(c=>c.classList.add('bento-half'));}
 if(state.activeTab==='clinics'){[...el.children].forEach(c=>c.classList.add('bento-half'));}
}
document.addEventListener('visibilitychange',anatomyMotion);reducedMotion.addEventListener('change',anatomyMotion);
// Low-contrast, fixed decorative canvas; no interaction or clinical meaning.
const moleculeCanvas=document.createElement('canvas');moleculeCanvas.id='bgMolecules';moleculeCanvas.setAttribute('aria-hidden','true');document.body.prepend(moleculeCanvas);
const moleculeCtx=moleculeCanvas.getContext('2d');let molecules=[],molW=0,molH=0,molRAF=0,molTime=0;
function moleculeResize(){molW=innerWidth;molH=innerHeight;const d=Math.min(devicePixelRatio||1,2);moleculeCanvas.width=molW*d;moleculeCanvas.height=molH*d;moleculeCtx.setTransform(d,0,0,d,0,0);molecules=Array.from({length:molW<640?7:17},(_,i)=>({x:(i*.618%1)*molW,y:(i*.381+.14)%1*molH,r:22+i%5*9,a:i,v:(i%2?1:-1)*.00006}));moleculeDraw(0);}
function moleculeDraw(dt){moleculeCtx.clearRect(0,0,molW,molH);for(const m of molecules){if(!reducedMotion.matches){m.a+=dt*m.v;m.y=(m.y+dt*.002)%molH;}const pts=Array.from({length:4},(_,i)=>({x:m.x+Math.cos(m.a+i*1.8)*m.r,y:m.y+Math.sin(m.a+i*1.8)*m.r}));moleculeCtx.strokeStyle='rgba(8,127,128,.25)';moleculeCtx.lineWidth=1;for(let i=1;i<4;i++){moleculeCtx.beginPath();moleculeCtx.moveTo(pts[0].x,pts[0].y);moleculeCtx.lineTo(pts[i].x,pts[i].y);moleculeCtx.stroke();}pts.forEach((p,i)=>{moleculeCtx.fillStyle=['#087F80','#102C46','#91CECA','#B7DCDA'][i];moleculeCtx.beginPath();moleculeCtx.arc(p.x,p.y,i?3:5,0,Math.PI*2);moleculeCtx.fill();});}}
function moleculeLoop(now){molRAF=0;if(document.hidden||reducedMotion.matches)return;const dt=Math.min(now-molTime,60);if(dt>=30){moleculeDraw(dt);molTime=now;}molRAF=requestAnimationFrame(moleculeLoop);}
function moleculeResume(){cancelAnimationFrame(molRAF);molRAF=0;molTime=performance.now();if(!document.hidden&&!reducedMotion.matches)molRAF=requestAnimationFrame(moleculeLoop);else moleculeDraw(0);}
addEventListener('resize',moleculeResize);document.addEventListener('visibilitychange',moleculeResume);reducedMotion.addEventListener('change',moleculeResume);moleculeResize();moleculeResume();


  function summaryMarkup(text) {
    // Sentence boundaries only; decimal points remain inside numeric values.
    const lines=String(text).split(/\n+|(?<=[.!?])\s+(?=\p{Lu})/u).map(x=>x.trim()).filter(Boolean);
    const mark=line=>escapeHTML(line).replace(/(?:[+\-−]?\d+(?:[.,]\d+)?(?:\s*[%°])?|\b(?:Baseline|Verbal|VR|GPS|GVS|MAD|ROM|Macro-F1)\b)/g,m=>'<strong>'+m+'</strong>');
    return '<ul class="readable-summary" style="color:#102C46;line-height:1.6;padding-left:1.25rem;margin:0.75rem 0">'+lines.map(line=>'<li style="margin:0.55rem 0">'+mark(line)+'</li>').join('')+'</ul>';
  }


// Single rendering entry points. Feature phases never replace these functions.
function renderWorkspaceHeader(){
 renderCoreHeader();renderWorkspaceNotices();renderMobileDetails();applyWorkspaceGate();
}
function renderTabContent(){
 stopSpeech();
 if(!state.user||!state.dataLoaded){videoStop(true);$('tabContent').replaceChildren();return;}
 if(state.activeTab==='video')videoRender();
 else {videoStop(true);if(!state.selectedPatient){$('tabContent').replaceChildren();return;}renderCoreTab();decorateAnalyticsTab();}
 arrangeBento();
}
const dependencyCopy={
 kk:['Офлайн және қосылу','CSV/демо талдауы, GroupKFold ML, МДТ бағыты, чеклист және экспорт браузерде офлайн жұмыс істейді.','Видеоның MediaPipe моделі мен 3D көрермен кітапханасын алғаш жүктеуге интернет қажет. Жергілікті models/skeleton.glb файлын HTTP/HTTPS сервері арқылы ашыңыз (localhost жарайды). Камераға қауіпсіз контекст қажет. Видео мен 3D — диагностикалық құралдар емес.'],
 ru:['Офлайн и подключение','CSV/демо-анализ, GroupKFold ML, маршрут МДГ, чеклист и экспорт работают офлайн в браузере.','Для первоначальной загрузки MediaPipe и библиотеки 3D-просмотра нужен интернет. Локальный models/skeleton.glb открывайте через HTTP/HTTPS-сервер (подходит localhost). Камере нужен безопасный контекст. Видео и 3D не являются диагностическими инструментами.'],
 en:['Offline and connections','CSV/demo analysis, GroupKFold ML, MDG routing, checklist and exports work offline in the browser.','Initial MediaPipe model and 3D viewer library downloads need internet. Serve local models/skeleton.glb through HTTP/HTTPS (localhost is suitable). Camera access needs a secure context. Video and 3D are not diagnostic tools.']
};
function renderDependencyNotice(){
 let box=$('dependencyNotice');if(!box){box=document.createElement('details');box.id='dependencyNotice';box.className='dependency-notice';document.querySelector('main').prepend(box);}
 const copy=dependencyCopy[state.lang];box.innerHTML='<summary>'+escapeHTML(copy[0])+'</summary>'+copy.slice(1).map(x=>'<p>'+escapeHTML(x)+'</p>').join('');
}
function renderAll(){
 stopSpeech();if(!state.user)videoStop(true);prepareDisplayText();renderCoreApp();
 document.body.classList.toggle('has-data',!!state.dataLoaded&&!!state.user);
 document.body.classList.toggle('analysis-view',!!state.user);
 const landing=$('landingSection');landing.querySelector('.hero-anatomy')?.remove();
 if(!state.user)landing.append(anatomyCard(true));anatomyMotion();renderDependencyNotice();
}
function localAgentAnswer(q,idx=null){
 if(idx===null&&isSafetyTrigger(q))return answerCoreQuestion(q,idx);
 if(idx===null&&/видео|бейне|video/i.test(q)){
  const r=state.lastVideoSummary,valid=r&&r.subject===state.selectedPatient;
  return {text:valid?screeningText(r):vt('noneVideo'),targetTab:state.user&&state.dataLoaded?'video':null};
 }
 if(idx===null&&/^(привет|здравствуйте|сәлем|hello|hi)[!.\s]*$/i.test(q.trim()))return {text:u('welcome')};
 const ans=answerCoreQuestion(q,idx);
 if(!ans.danger&&state.selectedPatient&&/vr|verbal|эффект|маңыз|параметр|feature|effective|тиімді/i.test(q)){
  const insight=cohortInsightText();if(insight&&!ans.text.includes(insight))ans.text+='\n\n'+insight;
 }
 return ans;
}

  initDraggableFAB();
  renderAll();
})();
