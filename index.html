<!doctype html>
<html lang="ru">
<head>
<link rel="icon" href="data:,">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QadamCare — AI Gait Analysis Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
<link rel="stylesheet" href="./style.css"></head>
<body>
  <!-- Sticky Topbar -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" id="brandHomeBtn" title="QadamCare">
        <div class="brand-icon" aria-hidden="true">
          <!-- Custom QadamCare Logo (Q with footprints & teal path) -->
          <svg viewBox="0 0 100 100" width="40" height="40">
            <path d="M50 8 A42 42 0 1 0 85 73 L74 65 A29 29 0 1 1 50 21 A29 29 0 0 1 77 59 L90 64 A42 42 0 0 0 50 8 Z" fill="#102C46"/>
            <path d="M29 73 C37 56 50 56 61 48 C69 42 74 34 76 26 C79 37 73 49 63 55 C52 62 43 65 39 78 Z" fill="#087F80"/>
            <path d="M46 66 L64 66 L80 81 C84 85 89 84 91 88 C93 92 89 96 84 96 L72 96 C66 96 62 93 58 88 L46 66 Z" fill="#087F80"/>
            <!-- Footprints -->
            <g transform="translate(36 53) rotate(-32)" fill="#102C46">
              <ellipse cx="0" cy="-6" rx="5" ry="9"/>
              <rect x="-4" y="5" width="8" height="5" rx="2.5"/>
            </g>
            <g transform="translate(56 36) rotate(-32)" fill="#102C46">
              <ellipse cx="0" cy="-6" rx="5" ry="9"/>
              <rect x="-4" y="5" width="8" height="5" rx="2.5"/>
            </g>
          </svg>
        </div>
        <span>QadamCare</span>
      </div>

      <div class="topbar-controls">
        <div class="lang-group" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="kk">ҚАЗ</button>
          <button type="button" class="lang-btn" data-lang="ru">РУС</button>
          <button type="button" class="lang-btn" data-lang="en">ENG</button>
        </div>

        <label class="font-toggle">
          <input type="checkbox" id="globalLargeFont">
          <span id="lblGlobalLargeFont"></span>
        </label>

        <!-- Auth buttons (shown on Title Page when logged out) -->
        <div id="topbarAuthBtns" class="row-flex" style="gap:0.45rem;">
          <button type="button" class="btn-secondary btn-sm" id="openLoginBtn"></button>
          <button type="button" class="btn-primary btn-sm" id="openRegisterBtn"></button>
        </div>

        <!-- Logged-in user info + Logout -->
        <div id="topbarUserArea" class="row-flex hidden" style="gap:0.45rem;">
          <span class="badge badge-primary" id="userBadge"></span>
          <button type="button" class="btn-secondary btn-sm" id="logoutBtn"></button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- Global Medical Ethics Banner (Rule 8.2) -->
    <div class="ethics-banner" role="note">
      <span style="font-size:1.2rem;">⚕️</span>
      <span id="ethicsBannerText"></span>
    </div>

    <!-- ==================== 1. TITLE PAGE (LANDING) ==================== -->
    <section id="landingSection">
      <div class="hero-box">
        <div>
          <span class="badge badge-vr" id="heroBadge" style="margin-bottom:0.75rem;"></span>
          <h1 class="hero-title" id="heroTitle"></h1>
          <p class="muted" id="heroSub" style="font-size:1rem;margin-bottom:1.15rem;"></p>
          <div class="row-flex">
            <button type="button" class="btn-vr" id="heroQuickDoctorBtn"></button>
            <button type="button" class="btn-secondary" id="heroQuickParentBtn"></button>
          </div>
        </div>
        <div class="hero-visual">
          <div style="font-weight:700;color:var(--primary);margin-bottom:0.4rem;" id="heroPreviewTitle"></div>
          <svg class="chart-svg" viewBox="0 0 420 200" role="img" aria-label="Gait Curve Preview">
            <rect x="175" y="18" width="76" height="142" fill="rgba(5,150,105,0.10)"></rect>
            <line x1="36" y1="160" x2="395" y2="160" stroke="#CBD5E1"></line>
            <line x1="36" y1="18" x2="36" y2="160" stroke="#CBD5E1"></line>
            <path d="M36,68 C95,90 165,126 218,120 C275,112 330,62 395,70" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="6 4"></path>
            <path d="M36,74 C95,98 165,138 218,132 C275,124 330,66 395,75" fill="none" stroke="#2563EB" stroke-width="3"></path>
            <path d="M36,78 C95,105 165,148 218,144 C275,134 330,70 395,78" fill="none" stroke="#059669" stroke-width="3.5"></path>
            <text x="36" y="182" font-size="11" fill="#64748B">0% GC</text>
            <text x="180" y="182" font-size="11" fill="#059669" font-weight="700">40–60%</text>
            <text x="355" y="182" font-size="11" fill="#64748B">100% GC</text>
            <text x="48" y="34" font-size="11" fill="#64748B" font-weight="700">--- Baseline</text>
            <text x="135" y="34" font-size="11" fill="#2563EB" font-weight="700">— Verbal</text>
            <text x="210" y="34" font-size="11" fill="#059669" font-weight="700">— VR</text>
          </svg>
        </div>
      </div>

      <div class="grid-3" id="landingFeatures"></div>
    </section>

    <!-- ==================== 2. APP WORKSPACE ==================== -->
    <section id="appSection" class="hidden">
      <!-- Data Upload Card -->
      <div class="card" id="uploadCard">
        <div class="row-flex" style="justify-content:space-between;">
          <div>
            <h2 id="uploadTitle"></h2>
            <p class="muted" id="uploadDesc" style="margin-bottom:0;"></p>
          </div>
          <div class="row-flex">
            <button type="button" class="btn-vr" id="loadDemoDataBtn"></button>
            <button type="button" class="btn-secondary btn-sm hidden" id="toggleUploadBtn"></button>
          </div>
        </div>
        <div id="uploadInputsWrap" style="margin-top:0.85rem;">
          <input type="file" id="csvFilesInput" accept=".csv" multiple>
          <p class="muted" id="uploadStatus" style="margin-top:0.5rem;margin-bottom:0;"></p>
        </div>
      </div>

      <!-- Workspace Content -->
      <div id="workspace" class="hidden">
        <!-- Parent Card Linking Onboarding (shown for Parent until a card is linked) -->
        <div id="parentLinkCard" class="card hidden">
          <h2 id="parentLinkTitle"></h2>
          <p class="muted" id="parentLinkDesc"></p>
          <div class="row-flex" style="margin-top:0.75rem;align-items:flex-end;">
            <div style="flex:1;min-width:220px;">
              <label class="field-label" for="parentLinkSelect" id="lblParentLinkSelect" style="margin-top:0;"></label>
              <select id="parentLinkSelect"></select>
            </div>
            <button type="button" class="btn-primary" id="btnConfirmParentLink"></button>
          </div>
        </div>

        <div id="patientWorkspaceInner">
          <!-- Patient Header -->
          <div class="card patient-bar" id="patientHeader">
            <div class="row-flex" style="align-items:flex-end;justify-content:space-between;">
              <div style="min-width:220px;">
                <label class="field-label" for="patientSelect" id="lblPatientSelect" style="margin-top:0;"></label>
                <select id="patientSelect"></select>
                <div id="parentFixedRow" class="row-flex hidden" style="gap:0.45rem;">
                  <div id="parentFixedPatient" class="badge badge-primary" style="font-size:0.95rem;padding:0.45rem 0.85rem;"></div>
                  <button type="button" class="btn-secondary btn-sm" id="btnUnlinkParentCard"></button>
                </div>
              </div>
              <div id="patientMeta" class="patient-meta"></div>
            </div>
            <div id="dataQualityBadge"></div>
          </div>

          <!-- 5 Clean Tabs -->
          <nav class="nav-tabs" id="mainTabs" role="tablist"></nav>

          <!-- Tab Body -->
          <div id="tabContent"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- ==================== AUTH MODAL (LOGIN / REGISTER) ==================== -->
  <div id="authModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="authModalTitle" style="margin:0;"></h2>
        <button type="button" class="btn-secondary btn-sm" id="closeAuthModal">✕</button>
      </div>

      <div class="auth-switch">
        <button type="button" id="switchLoginBtn"></button>
        <button type="button" id="switchRegisterBtn"></button>
      </div>

      <div id="authErrorBox" class="form-err hidden"></div>

      <!-- Login Form -->
      <form id="loginForm">
        <label class="field-label" for="loginUser" id="lblLoginUser"></label>
        <input type="text" id="loginUser" autocomplete="username" required>

        <label class="field-label" for="loginPass" id="lblLoginPass"></label>
        <div class="pass-wrap">
          <input type="password" id="loginPass" autocomplete="current-password" required>
          <button type="button" class="pass-toggle" id="toggleLoginPass" aria-label="Show password"></button>
        </div>

        <button type="submit" class="btn-primary" id="btnSubmitLogin" style="width:100%;margin-top:1rem;"></button>

        <div class="row-flex" style="margin-top:0.85rem;">
          <button type="button" class="btn-vr btn-sm" id="modalDemoDocBtn" style="flex:1;"></button>
          <button type="button" class="btn-secondary btn-sm" id="modalDemoParentBtn" style="flex:1;"></button>
        </div>

        <button type="button" class="btn-secondary btn-sm" id="damumedAuthStub" disabled style="width:100%;margin-top:0.65rem;"></button>
      </form>

      <!-- Register Form (Creates account ONLY, NO auto-login, NO patient code required) -->
      <form id="registerForm" class="hidden">
        <label class="field-label" for="regUser" id="lblRegUser"></label>
        <input type="text" id="regUser" autocomplete="username" required>

        <label class="field-label" for="regPass" id="lblRegPass"></label>
        <div class="pass-wrap">
          <input type="password" id="regPass" autocomplete="new-password" minlength="8" required>
          <button type="button" class="pass-toggle" id="toggleRegPass" aria-label="Show password"></button>
        </div>

        <label class="field-label" for="regRole" id="lblRegRole"></label>
        <select id="regRole">
          <option value="doctor" id="optRoleDoc"></option>
          <option value="parent" id="optRoleParent"></option>
        </select>

        <!-- Doctor specialization -->
        <div id="regDoctorFields">
          <label class="field-label" for="regSpec" id="lblRegSpec"></label>
          <select id="regSpec"></select>
        </div>

        <!-- Parent fields (city & large font option, no patient code required at registration) -->
        <div id="regParentFields" class="hidden">
          <label class="field-label" for="regCity" id="lblRegCity"></label>
          <select id="regCity"></select>

          <label class="checkbox-row">
            <input type="checkbox" id="regLargeFont">
            <span id="lblRegLargeFont"></span>
          </label>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="regEthicsCheck" required>
          <span id="lblRegEthics"></span>
        </label>

        <button type="submit" class="btn-primary" id="btnSubmitRegister" style="width:100%;margin-top:1rem;"></button>
      </form>
    </div>
  </div>

  <!-- ==================== FLOATING DRAGGABLE ASSISTANT ==================== -->
  <button type="button" id="aiFab" class="ai-fab" aria-label="QadamCare Assistant" title="QadamCare">
    <!-- Symmetric Chat Bubble with 3 Stars & Teal Arcs (no 'AI' text) -->
    <svg viewBox="0 0 100 100" width="56" height="56" aria-hidden="true">
      <path d="M18 33 A38 38 0 0 1 82 33 A44 44 0 0 0 18 33 Z" fill="#087F80"/>
      <path d="M18 69 A38 38 0 0 0 82 69 A44 44 0 0 1 18 69 Z" fill="#087F80"/>
      <path d="M50 18 C32 18 18 32 18 50 C18 57 20 63 24 68 L19 80 L33 75 C38 78 44 80 50 80 C68 80 82 66 82 50 C82 32 68 18 50 18 Z" fill="#102C46"/>
      <!-- Center star -->
      <path d="M50 31 C51.5 43 55 46.5 67 48 C55 49.5 51.5 53 50 65 C48.5 53 45 49.5 33 48 C45 46.5 48.5 43 50 31 Z" fill="#FFFFFF"/>
      <!-- Left star -->
      <path d="M31 38 C32 43 33.5 44.5 38 45.5 C33.5 46.5 32 48 31 53 C30 48 28.5 46.5 24 45.5 C28.5 44.5 30 43 31 38 Z" fill="#FFFFFF"/>
      <!-- Right star -->
      <path d="M69 38 C70 43 71.5 44.5 76 45.5 C71.5 46.5 70 48 69 53 C68 48 66.5 46.5 62 45.5 C66.5 44.5 68 43 69 38 Z" fill="#FFFFFF"/>
    </svg>
  </button>

  <aside id="aiChatPanel" class="ai-chat-panel hidden" aria-label="Assistant Chat">
    <div class="ai-chat-header">
      <div class="ai-hdr-brand">
        <div class="ai-hdr-avatar" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="32" height="32">
            <path d="M18 33 A38 38 0 0 1 82 33 A44 44 0 0 0 18 33 Z" fill="#087F80"/>
            <path d="M18 69 A38 38 0 0 0 82 69 A44 44 0 0 1 18 69 Z" fill="#087F80"/>
            <path d="M50 18 C32 18 18 32 18 50 C18 57 20 63 24 68 L19 80 L33 75 C38 78 44 80 50 80 C68 80 82 66 82 50 C82 32 68 18 50 18 Z" fill="#102C46"/>
            <path d="M50 31 C51.5 43 55 46.5 67 48 C55 49.5 51.5 53 50 65 C48.5 53 45 49.5 33 48 C45 46.5 48.5 43 50 31 Z" fill="#FFFFFF"/>
            <path d="M31 38 C32 43 33.5 44.5 38 45.5 C33.5 46.5 32 48 31 53 C30 48 28.5 46.5 24 45.5 C28.5 44.5 30 43 31 38 Z" fill="#FFFFFF"/>
            <path d="M69 38 C70 43 71.5 44.5 76 45.5 C71.5 46.5 70 48 69 53 C68 48 66.5 46.5 62 45.5 C66.5 44.5 68 43 69 38 Z" fill="#FFFFFF"/>
          </svg>
        </div>
        <div>
          <div class="ai-chat-title" id="aiChatTitle"></div>
          <div class="ai-chat-sub" id="aiChatSub"></div>
        </div>
      </div>
      <div class="row-flex" style="gap:0.35rem;">
        <button type="button" class="ai-hdr-btn" id="aiClearBtn" title="Clear">🗑️</button>
        <button type="button" class="ai-hdr-btn" id="aiCloseBtn" title="Close">✕</button>
      </div>
    </div>

    <div class="ai-quick-bar" id="aiQuickBar"></div>

    <div class="ai-messages" id="aiMessages"></div>

    <form id="aiChatForm" class="ai-input-bar">
      <input type="text" id="aiChatInput" autocomplete="off" style="padding:0.5rem 0.75rem;font-size:0.88rem;">
      <button type="submit" class="btn-primary btn-sm" id="aiSendBtn"></button>
    </form>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  const $ = id => document.getElementById(id);

  function t(path) {
    const parts = path.split(".");
    let cur = I18N[state.lang] || I18N.ru;
    for (const p of parts) cur = cur?.[p];
    return cur ?? path;
  }

  function escapeHTML(v) {
    return String(v ?? "").replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
  }

  function showToast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => el.classList.remove("show"), 3200);
  }

  function fmt(v, d = 2) {
    return (typeof v === "number" && Number.isFinite(v)) ? v.toFixed(d) : t("noData");
  }

  function fmtDelta(cur, base) {
    if (cur == null || base == null || !Number.isFinite(cur) || !Number.isFinite(base)) return t("noData");
    const diff = cur - base;
    const pct = Math.abs(base) > 1e-9 ? (diff / Math.abs(base)) * 100 : null;
    const sign = diff > 0 ? "+" : "";
    return `${sign}${diff.toFixed(2)}` + (pct != null ? ` (${sign}${pct.toFixed(1)}%)` : "");
  }

  function validNums(arr) {
    return arr.filter(v => typeof v === "number" && Number.isFinite(v));
  }

  function mean(arr) {
    const v = validNums(arr);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
  }

  function std(arr) {
    const v = validNums(arr);
    if (v.length < 2) return 0;
    const m = mean(v);
    return Math.sqrt(v.reduce((s, x) => s + (x - m) ** 2, 0) / (v.length - 1));
  }

  function median(arr) {
    const v = validNums(arr).sort((a, b) => a - b);
    if (!v.length) return null;
    const mid = Math.floor(v.length / 2);
    return v.length % 2 ? v[mid] : (v[mid - 1] + v[mid]) / 2;
  }

  /* Two-sided Mann-Whitney U p-value (normal approximation) */
  function mannWhitneyP(aRaw, bRaw) {
    const a = validNums(aRaw), b = validNums(bRaw);
    const n1 = a.length, n2 = b.length;
    if (n1 < 3 || n2 < 3) return null;
    const combined = [
      ...a.map(v => ({ v, g: 1 })),
      ...b.map(v => ({ v, g: 2 }))
    ].sort((x, y) => x.v - y.v);
    let r1 = 0, i = 0;
    while (i < combined.length) {
      let j = i;
      while (j + 1 < combined.length && combined[j + 1].v === combined[i].v) j++;
      const avgRank = (i + j + 2) / 2;
      for (let k = i; k <= j; k++) if (combined[k].g === 1) r1 += avgRank;
      i = j + 1;
    }
    const u1 = r1 - (n1 * (n1 + 1)) / 2;
    const u = Math.min(u1, n1 * n2 - u1);
    const mu = (n1 * n2) / 2;
    const sigma = Math.sqrt((n1 * n2 * (n1 + n2 + 1)) / 12);
    if (sigma <= 0) return 1;
    const z = Math.abs((u - mu) / sigma);
    // Abramowitz & Stegun erfc approximation
    const tVal = 1 / (1 + 0.3275911 * (z / Math.SQRT2));
    const poly = tVal * (0.254829592 + tVal * (-0.284496736 + tVal * (1.421413741 + tVal * (-1.453152027 + tVal * 1.061405429))));
    const erfc = poly * Math.exp(-(z * z) / 2);
    return Math.min(1, Math.max(0, erfc));
  }

  /* =========================================================================
     4. CSV PARSER & SYNTHETIC DEMO DATASET GENERATOR (29 PATIENTS)
     ========================================================================= */
  function parseCSVText(text) {
    const lines = text.replace(/^\uFEFF/, "").trim().split(/\r?\n/);
    if (lines.length < 2) throw new Error("Empty CSV");
    const cols = lines[0].split(";").map(s => s.trim());
    if (!cols.includes("subject") || !cols.includes("side")) {
      throw new Error("CSV must contain 'subject' and 'side' columns separated by ';'");
    }
    return lines.slice(1).filter(Boolean).map(line => {
      const cells = line.split(";");
      const obj = {};
      for (let i = 0; i < cols.length; i++) {
        const c = cols[i];
        const raw = (cells[i] ?? "").trim();
        if (c === "subject" || c === "side") obj[c] = raw;
        else if (raw === "" || raw === "NaN" || raw === "NA") obj[c] = null;
        else {
          const num = Number(raw.replace(",", "."));
          obj[c] = Number.isFinite(num) ? num : null;
        }
      }
      return obj;
    });
  }

  function mulberry32(seed) {
    return function() {
      let tVal = seed += 0x6D2B79F5;
      tVal = Math.imul(tVal ^ (tVal >>> 15), tVal | 1);
      tVal ^= tVal + Math.imul(tVal ^ (tVal >>> 7), tVal | 61);
      return ((tVal ^ (tVal >>> 14)) >>> 0) / 4294967296;
    };
  }

  function loadDemoDataset() {
    const rand = mulberry32(20261124);
    const gauss = () => (rand() + rand() + rand() - 1.5) * 1.15;
    const disc = { Baseline: [], Verbal: [], VR: [] };
    const kin = { Baseline: [], Verbal: [], VR: [] };

    for (let id = 1; id <= 29; id++) {
      const subject = `demo_${id}`;
      const side = id % 2 === 0 ? "RIGHT" : "LEFT";
      const weight = +(24 + rand() * 34).toFixed(1);
      const height = +(1.15 + rand() * 0.45).toFixed(2);
      const LegLength = +(height * 0.51).toFixed(3);

      const baseHip = 10 + rand() * 11;
      const basePelv = 8 + rand() * 9;
      const baseKnee = 10 + rand() * 10;
      const baseAnk = 5 + rand() * 7;
      const baseMinH = 2 + rand() * 18;
      const basePct = 42 + rand() * 18;

      // Heterogeneous response across 29 patients (some VR better, some Verbal better, some compensation)
      const vrEffect = id % 3 === 0 ? -(1.8 + rand() * 2.4) : (id % 3 === 1 ? -(0.4 + rand() * 1.3) : (0.3 + rand() * 0.9));
      const verbEffect = id % 3 === 1 ? -(1.7 + rand() * 2.1) : -(0.5 + rand() * 1.2);
      const kneeCompVR = (id === 1 || id === 5 || id === 12) ? 1.45 : (rand() - 0.5) * 0.8;

      for (const cond of CONDITIONS) {
        const nCycles = (cond === "Baseline" && id === 7) ? 20 : ((cond === "Baseline" && (id === 4 || id === 8 || id === 15)) ? 32 : 30);
        const effH = cond === "VR" ? vrEffect : (cond === "Verbal" ? verbEffect : 0);
        const effK = cond === "VR" ? kneeCompVR : (cond === "Verbal" ? (rand() - 0.5) * 0.6 : 0);

        for (let c = 0; c < nCycles; c++) {
          // Occasional unstable outlier cycle
          const isOutlier = rand() < (cond === "Baseline" ? 0.10 : 0.05);
          const spike = isOutlier ? (3.5 + rand() * 2.5) : 0;

          const gH = Math.max(2, baseHip + effH + gauss() * 1.1 + spike);
          const gP = Math.max(2, basePelv + (effH * -0.1) + gauss() * 0.9);
          const gK = Math.max(2, baseKnee + effK + gauss() * 1.0 + spike * 0.6);
          const gA = Math.max(2, baseAnk + gauss() * 0.7);
          const gps = Math.sqrt((gP * gP + gH * gH + gK * gK + gA * gA) / 4);
          const minH = baseMinH + effH * 1.15 + gauss() * 1.4;
          const missingKinetics = (id === 22) || (id === 19 && cond === "Verbal" && c === 0) || (id === 3 && cond === "VR" && c === 0);
          const pctM = missingKinetics ? null : Math.max(15, Math.min(85, basePct + effH * 0.7 + gauss() * 2.2));

          const dRow = {
            subject, side, weight, height, LegLength,
            GPS_a: gps, GVS_aSagP: gP, GVS_aSagH: gH, GVS_aSagK: gK, GVS_aSagA: gA,
            aMinSagH: minH, pctmZeroStSagH: pctM
          };
          disc[cond].push(dRow);

          const kRow = { subject, side, weight, height, LegLength };
          for (let step = 0; step <= 50; step++) {
            const N = step * 20;
            const p = step / 50;
            const rad = p * Math.PI * 2;
            kRow[`aSagH_pct_GC_${N}`] = 18 + Math.cos(rad) * 20 + effH * 1.1 * Math.sin(p * Math.PI) + gauss() * 1.6;
            kRow[`aSagP_pct_GC_${N}`] = 14 + Math.sin(rad * 2) * 3.5 + gauss() * 1.0;
            kRow[`aSagK_pct_GC_${N}`] = 28 + Math.sin(rad - 0.9) * 24 + effK * 0.9 + gauss() * 2.0;
            kRow[`aSagA_pct_GC_${N}`] = 2 + Math.sin(rad * 2 + 0.5) * 11 + gauss() * 1.2;
            kRow[`mSagH_pct_GC_${N}`] = missingKinetics ? null : (0.35 * Math.cos(rad) + effH * 0.03 + gauss() * 0.08);
          }
          kin[cond].push(kRow);
        }
      }
      // Inject 1 exact Baseline duplicate for s61520_28 to mirror KU Leuven data quality finding
      if (id === 28) {
        const lastIdx = disc.Baseline.length - 1;
        disc.Baseline.push({ ...disc.Baseline[lastIdx] });
        kin.Baseline.push({ ...kin.Baseline[lastIdx] });
      }
    }

    applyLoadedData(disc, kin, true);
    showToast(t("demoLoaded"));
  }

  function applyLoadedData(disc, kin, isDemo) {
    state.discrete = disc;
    state.kinematics = kin;
    state.isDemoData = isDemo;
    state.dataLoaded = true;
    state.mlCache = null;

    const uniq = [...new Set(CONDITIONS.flatMap(c => disc[c].map(r => r.subject)))];
    uniq.sort((a, b) => {
      const na = Number(a.split("_").pop()), nb = Number(b.split("_").pop());
      return (Number.isFinite(na) && Number.isFinite(nb)) ? na - nb : a.localeCompare(b);
    });
    state.patients = uniq;

    if (state.user?.role === "parent") {
      if (state.user.childCode && state.patients.includes(state.user.childCode)) {
        state.selectedPatient = state.user.childCode;
      } else {
        state.selectedPatient = null;
      }
    } else if (!state.selectedPatient || !state.patients.includes(state.selectedPatient)) {
      state.selectedPatient = state.patients[0];
    }
    loadMDGForSubject(state.selectedPatient);

    state.showUpload = false;
    renderAll();
  }

  function loadMDGForSubject(subject) {
    const saved = subject ? state.mdgBySubject[subject] : null;
    state.neuroStatus = saved?.neuro ?? 0;
    state.psychStatus = saved?.psych ?? 0;
  }

  function saveMDGForSubject(subject) {
    if (!subject) return;
    state.mdgBySubject[subject] = { neuro: Number(state.neuroStatus) || 0, psych: Number(state.psychStatus) || 0 };
  }

  /* =========================================================================
     5. ANALYTICS: STATS, COMPENSATIONS, UNSTABLE STEPS, COHORT & MDG
     ========================================================================= */
  function getPatientStats(pid) {
    const out = {};
    for (const cond of CONDITIONS) {
      const rows = state.discrete[cond].filter(r => r.subject === pid);
      const metrics = {};
      for (const m of METRICS) {
        const vals = validNums(rows.map(r => r[m]));
        metrics[m] = { mean: mean(vals), sd: std(vals), med: median(vals), n: vals.length, vals };
      }
      out[cond] = { rows, metrics };
    }
    return out;
  }

  function detectCompensations(pid) {
    const st = getPatientStats(pid);
    const baseHip = st.Baseline.metrics.GVS_aSagH.mean;
    const flags = [];
    for (const cond of ["Verbal", "VR"]) {
      const hip = st[cond].metrics.GVS_aSagH.mean;
      if (baseHip == null || hip == null || hip >= baseHip) continue;
      for (const m of ["GVS_aSagP", "GVS_aSagK", "GVS_aSagA"]) {
        const b = st.Baseline.metrics[m].mean;
        const c = st[cond].metrics[m].mean;
        if (b != null && c != null && Math.abs(b) > 1e-9) {
          const pct = ((c - b) / Math.abs(b)) * 100;
          if (pct > 5) flags.push({ cond, metric: m, pct });
        }
      }
    }
    return flags;
  }

  /* Robust MAD Z-score per cycle across non-NaN discrete features */
  function detectUnstableSteps(pid) {
    const st = getPatientStats(pid);
    const coreCols = ["GPS_a", "GVS_aSagP", "GVS_aSagH", "GVS_aSagK", "GVS_aSagA", "aMinSagH"];
    const allRows = CONDITIONS.flatMap(c => st[c].rows);
    const medMap = {}, madMap = {};
    for (const col of coreCols) {
      const vals = validNums(allRows.map(r => r[col]));
      const m = median(vals) ?? 0;
      const absDevs = vals.map(x => Math.abs(x - m));
      const mad = (median(absDevs) ?? 0) * 1.4826 || std(vals) || 1;
      medMap[col] = m;
      madMap[col] = mad;
    }

    const res = {};
    for (const cond of CONDITIONS) {
      const points = st[cond].rows.map((r, idx) => {
        let maxZ = 0;
        for (const col of coreCols) {
          if (typeof r[col] === "number" && Number.isFinite(r[col])) {
            const z = Math.abs((r[col] - medMap[col]) / madMap[col]);
            if (z > maxZ) maxZ = z;
          }
        }
        return { idx: idx + 1, gps: r.GPS_a, hip: r.GVS_aSagH, z: maxZ, unstable: maxZ > 2.5 };
      });
      const unstable = points.filter(p => p.unstable).length;
      res[cond] = { total: points.length, unstable, pct: points.length ? (unstable / points.length) * 100 : 0, points };
    }
    return res;
  }

  function computeCohortStats() {
    let vrBetter = 0, verbalBetter = 0, minimal = 0;
    const improvements = { Verbal: [], VR: [] };
    for (const pid of state.patients) {
      const st = getPatientStats(pid);
      const b = st.Baseline.metrics.GVS_aSagH.mean;
      const v = st.Verbal.metrics.GVS_aSagH.mean;
      const r = st.VR.metrics.GVS_aSagH.mean;
      if (b == null || v == null || r == null) continue;
      const impV = b - v;
      const impR = b - r;
      improvements.Verbal.push({ pid, val: impV });
      improvements.VR.push({ pid, val: impR });
      if (Math.abs(impR - impV) <= (state.cohortThreshold ?? 0.35)) minimal++;
      else if (impR > impV) vrBetter++;
      else verbalBetter++;
    }
    const percentileFor = (cond, pid) => {
      const arr = improvements[cond];
      const mine = arr.find(x => x.pid === pid);
      if (!mine || !arr.length) return null;
      const below = arr.filter(x => x.val <= mine.val).length;
      return Math.round((below / arr.length) * 100);
    };
    return { total: state.patients.length, vrBetter, verbalBetter, minimal, percentileFor };
  }

  function generateSummaryText(pid) {
    const st = getPatientStats(pid);
    const bH = st.Baseline.metrics.GVS_aSagH.mean;
    const vH = st.Verbal.metrics.GVS_aSagH.mean;
    const rH = st.VR.metrics.GVS_aSagH.mean;
    const bG = st.Baseline.metrics.GPS_a.mean;
    const vG = st.Verbal.metrics.GPS_a.mean;
    const rG = st.VR.metrics.GPS_a.mean;
    const comps = detectCompensations(pid);
    const unst = detectUnstableSteps(pid);
    const L = state.lang;

    let best = null;
    if (bH != null && vH != null && rH != null) {
      if (Math.min(vH, rH) < bH) best = rH < vH ? "VR" : "Verbal";

    if (L === "kk") {

        `Жалпы GPS профилі: Baseline ${fmt(bG)} → Verbal ${fmt(vG)}, VR ${fmt(rG)}. ` +

        `Тұрақсыз қадам үлесі: Baseline ${unst.Baseline.pct.toFixed(1)}%, Verbal ${unst.Verbal.pct.toFixed(1)}%, VR ${unst.VR.pct.toFixed(1)}%. ` +
        (comps.length ? `Компенсация белгісі: ${comps.map(c => `${c.cond} ${c.metric} +${c.pct.toFixed(1)}%`).join(", ")}. ` : "") +
        "МКФ анықтамасы: b770, d450. Бұл өлшемдер сипаттамасы, диагноз емес.";

    if (L === "en") {

        (comps.length ? `Compensation flag: ${comps.map(c => `${c.cond} ${c.metric} +${c.pct.toFixed(1)}%`).join(", ")}. ` : "") +

        (comps.length ? `Флаг компенсации: ${comps.map(c => `${c.cond} ${c.metric} +${c.pct.toFixed(1)}%`).join(", ")}. ` : "") +
      "Справочно по МКФ: b770, d450. Это описание биомеханики, не постановка диагноза.";
  }

  function cohortInsightText() {
    if (!state.dataLoaded || state.patients.length < 5) return "";
    const cohort = computeCohortStats();
    const ml = runGroupKFoldML();
    const best = ml?.models?.[0];
    if (state.lang === "kk") return `Когорталық зерттеулік үлгі (n=${cohort.total}): VR сан GVS бойынша ${cohort.vrBetter}, Verbal ${cohort.verbalBetter}, айырмасы аз ${cohort.minimal} пациентда төмен болды. Классификатордың маңызды белгілері: ${(ml?.featureImportance||[]).slice(0,3).map(x=>t("metrics."+x.col)).join(", ")}. ML сапасы ${best ? (best.accMean*100).toFixed(1)+"%" : "қолжетімсіз"}. Бұл зерттеулік когорталық үлгі, диагноз емес. `;
    if (state.lang === "en") return `Exploratory cohort pattern (n=${cohort.total}): lower hip GVS for VR in ${cohort.vrBetter}, Verbal in ${cohort.verbalBetter}, and similar in ${cohort.minimal} patients. Largest Logistic Regression coefficient magnitudes: ${(ml?.featureImportance||[]).slice(0,3).map(x=>t("metrics."+x.col)).join(", ")}. ML accuracy ${best ? (best.accMean*100).toFixed(1)+"%" : "unavailable"}. Exploratory cohort comparison between VR and Verbal, not improvement versus Baseline or a diagnosis. `;
    return `Когортный исследовательский паттерн (n=${cohort.total}): снижение GVS бедра отмечено для VR у ${cohort.vrBetter}, для Verbal у ${cohort.verbalBetter}, сходный эффект у ${cohort.minimal} пациентов. Важные признаки классификатора: ${(ml?.featureImportance||[]).slice(0,3).map(x=>t("metrics."+x.col)).join(", ")}. Точность ML ${best ? (best.accMean*100).toFixed(1)+"%" : "недоступна"}. Это исследовательская когортная закономерность, не диагноз. `;
  }

  function buildMDGRoute(pid) {
    const nIdx = Number(state.neuroStatus);
    const pIdx = Number(state.psychStatus);
    if (nIdx === 3) return { emergency: true };

    const st = getPatientStats(pid);
    const bH = st.Baseline.metrics.GVS_aSagH.mean;
    const vH = st.Verbal.metrics.GVS_aSagH.mean;
    const rH = st.VR.metrics.GVS_aSagH.mean;
    const vrFavored = (rH != null && bH != null && rH < bH && (vH == null || rH <= vH));
    const comps = detectCompensations(pid);
    const L = state.lang;

    let step1 = "", step2 = "", caution = "";
    if (L === "kk") {

      } else if (pIdx === 1) {

        (comps.length ? "Көрші буындарда компенсация қаупі бар — тізе/жамбас бақылауы қажет." : "Жаттығу барысында жайсыздық болса жүктемені тоқтатыңыз.");
    } else if (L === "en") {

      } else if (pIdx === 1) {

    }

  /* =========================================================================
     6. HONEST IN-BROWSER ML WITH STRICT GroupKFold BY SUBJECT (NO LEAKAGE)
     ========================================================================= */
  function runGroupKFoldML() {
    if (state.mlCache) return state.mlCache;
    if (!state.dataLoaded || state.patients.length < 5) return null;

    const featCols = ["GPS_a", "GVS_aSagP", "GVS_aSagH", "GVS_aSagK", "GVS_aSagA", "aMinSagH"];
    const samples = [];
    for (let cIdx = 0; cIdx < 3; cIdx++) {
      const cond = CONDITIONS[cIdx];
      for (const r of state.discrete[cond]) {
        samples.push({ subject: r.subject, y: cIdx, x: featCols.map(f => r[f]) });
      }
    }

    const subjects = [...state.patients];
    const k = Math.min(5, subjects.length);
    const folds = Array.from({ length: k }, () => new Set());
    subjects.forEach((s, idx) => folds[idx % k].add(s));

    function fitTransform(trainRows, testRows) {
      const d = featCols.length;
      const meds = [], means = [], sds = [];
      for (let j = 0; j < d; j++) {
        const vals = validNums(trainRows.map(r => r.x[j]));
        const med = median(vals) ?? 0;
        meds.push(med);
        const imp = trainRows.map(r => (r.x[j] == null ? med : r.x[j]));
        const m = mean(imp) ?? 0;
        const s = std(imp) || 1;
        means.push(m);
        sds.push(s);
      }
      const norm = rows => rows.map(r => ({
        y: r.y,
        x: r.x.map((v, j) => ((v == null ? meds[j] : v) - means[j]) / sds[j])
      }));
      return { train: norm(trainRows), test: norm(testRows) };
    }

    function evalPreds(yTrue, yPred) {
      const cm = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
      let correct = 0;
      for (let i = 0; i < yTrue.length; i++) {
        cm[yTrue[i]][yPred[i]]++;
        if (yTrue[i] === yPred[i]) correct++;
      }
      const acc = yTrue.length ? correct / yTrue.length : 0;
      let f1Sum = 0;
      for (let c = 0; c < 3; c++) {
        const tp = cm[c][c];
        const fp = cm[0][c] + cm[1][c] + cm[2][c] - tp;
        const fn = cm[c][0] + cm[c][1] + cm[c][2] - tp;
        const f1 = (2 * tp) / Math.max(1, 2 * tp + fp + fn);
        f1Sum += f1;
      }
      return { acc, macroF1: f1Sum / 3, cm };
    }

    function trainPredictLogReg(train, test) {
      const d = featCols.length;
      const W = Array.from({ length: 3 }, () => new Array(d).fill(0));
      const b = [0, 0, 0];
      const lr = 0.08, reg = 0.01, epochs = 70;
      for (let ep = 0; ep < epochs; ep++) {
        const gW = Array.from({ length: 3 }, () => new Array(d).fill(0));
        const gb = [0, 0, 0];
        for (const row of train) {
          const logits = [0, 1, 2].map(c => b[c] + row.x.reduce((s, v, j) => s + W[c][j] * v, 0));
          const maxL = Math.max(...logits);
          const exps = logits.map(l => Math.exp(l - maxL));
          const sumE = exps[0] + exps[1] + exps[2];
          for (let c = 0; c < 3; c++) {
            const diff = exps[c] / sumE - (row.y === c ? 1 : 0);
            gb[c] += diff;
            for (let j = 0; j < d; j++) gW[c][j] += diff * row.x[j];
          }
        }
        const n = Math.max(1, train.length);
        for (let c = 0; c < 3; c++) {
          b[c] -= lr * (gb[c] / n);
          for (let j = 0; j < d; j++) W[c][j] -= lr * (gW[c][j] / n + reg * W[c][j]);
        }
      }
      const preds = test.map(row => {
        const logits = [0, 1, 2].map(c => b[c] + row.x.reduce((s, v, j) => s + W[c][j] * v, 0));
        return logits.indexOf(Math.max(...logits));
      });
      const weightsMag = featCols.map((_, j) => Math.abs(W[0][j]) + Math.abs(W[1][j]) + Math.abs(W[2][j]));
      return { preds, weightsMag };
    }

    function trainPredictCentroid(train, test) {
      const d = featCols.length;
      const centroids = [0, 1, 2].map(c => {
        const cls = train.filter(r => r.y === c);
        return Array.from({ length: d }, (_, j) => mean(cls.map(r => r.x[j])) ?? 0);
      });
      const preds = test.map(row => {
        let bestC = 0, bestD = Infinity;
        for (let c = 0; c < 3; c++) {
          const dist = row.x.reduce((s, v, j) => s + (v - centroids[c][j]) ** 2, 0);
          if (dist < bestD) { bestD = dist; bestC = c; }
        }
        return bestC;
      });
      return { preds };
    }

    const lrAccs = [], lrF1s = [], ncAccs = [], ncF1s = [];
    const lrCM = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
    const ncCM = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
    const fiAcc = new Array(featCols.length).fill(0);

    for (let f = 0; f < k; f++) {
      const testSet = folds[f];
      const trainRaw = samples.filter(s => !testSet.has(s.subject));
      const testRaw = samples.filter(s => testSet.has(s.subject));
      if (!trainRaw.length || !testRaw.length) continue;
      const { train, test } = fitTransform(trainRaw, testRaw);
      const yTrue = test.map(r => r.y);

      const lrRes = trainPredictLogReg(train, test);
      const lrEv = evalPreds(yTrue, lrRes.preds);
      lrAccs.push(lrEv.acc);
      lrF1s.push(lrEv.macroF1);
      lrRes.weightsMag.forEach((w, j) => fiAcc[j] += w);
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) lrCM[i][j] += lrEv.cm[i][j];

      const ncRes = trainPredictCentroid(train, test);
      const ncEv = evalPreds(yTrue, ncRes.preds);
      ncAccs.push(ncEv.acc);
      ncF1s.push(ncEv.macroF1);
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) ncCM[i][j] += ncEv.cm[i][j];
    }

    const totalFi = fiAcc.reduce((a, b) => a + b, 0) || 1;
    const featureImportance = featCols.map((col, j) => ({ col, pct: (fiAcc[j] / totalFi) * 100 })).sort((a, b) => b.pct - a.pct);

    const m1 = { name: "Logistic Regression (L2)", accMean: mean(lrAccs) ?? 0, accSd: std(lrAccs), f1Mean: mean(lrF1s) ?? 0, f1Sd: std(lrF1s), cm: lrCM };
    const m2 = { name: "Nearest Centroid", accMean: mean(ncAccs) ?? 0, accSd: std(ncAccs), f1Mean: mean(ncF1s) ?? 0, f1Sd: std(ncF1s), cm: ncCM };
    const models = [m1, m2].sort((a, b) => b.f1Mean - a.f1Mean);

    state.mlCache = { folds: k, patientsCount: subjects.length, models, featureImportance };
    return state.mlCache;
  }

  /* =========================================================================
     7. SVG CHART BUILDERS (WAVEFORM ±1 SD & UNSTABLE STEPS SCATTER)
     ========================================================================= */
  function buildWaveformSVG(pid, signal) {
    const cols = Array.from({ length: 51 }, (_, i) => `${signal}_pct_GC_${i * 20}`);
    const series = CONDITIONS.map(cond => {
      const rows = state.kinematics[cond].filter(r => r.subject === pid);
      const means = cols.map(c => mean(rows.map(r => r[c])));
      const sds = cols.map(c => std(rows.map(r => r[c])));
      return { cond, means, sds };
    });

    const allVals = [];
    for (const s of series) {
      for (let i = 0; i < s.means.length; i++) {
        if (s.means[i] != null) {
          allVals.push(s.means[i] - s.sds[i], s.means[i] + s.sds[i]);
        }
      }
    }
    if (!allVals.length) return `<div class="card card-warn">${escapeHTML(t("noWaveData"))}</div>`;

    const minV = Math.min(...allVals);
    const maxV = Math.max(...allVals);
    const span = Math.max(maxV - minV, 1e-3);
    const padL = 56, padR = 18, padT = 24, padB = 46;
    const W = 760, H = 310;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const gx = idx => padL + (idx / 50) * plotW;
    const gy = v => padT + plotH - ((v - minV) / span) * plotH;

    let bands = "", lines = "";
    for (const s of series) {
      const upper = [], lower = [], pathCmds = [];
      let started = false;
      for (let i = 0; i < 51; i++) {
        const m = s.means[i];
        if (m == null) { started = false; continue; }
        const x = gx(i);
        upper.push(`${x.toFixed(1)},${gy(m + s.sds[i]).toFixed(1)}`);
        lower.unshift(`${x.toFixed(1)},${gy(m - s.sds[i]).toFixed(1)}`);
        pathCmds.push(`${started ? "L" : "M"}${x.toFixed(1)},${gy(m).toFixed(1)}`);
        started = true;
      }
      if (upper.length > 1) {
        bands += `<polygon points="${upper.join(" ")} ${lower.join(" ")}" fill="${COLORS[s.cond]}" fill-opacity="0.12"/>`;
      }
      if (pathCmds.length) {
        const dash = s.cond === "Baseline" ? ' stroke-dasharray="6 4"' : "";
        lines += `<path d="${pathCmds.join(" ")}" fill="none" stroke="${COLORS[s.cond]}" stroke-width="3"${dash}/>`;
      }
    }

    const hipZone = signal === "aSagH"
      ? `<rect x="${gx(20).toFixed(1)}" y="${padT}" width="${(gx(30) - gx(20)).toFixed(1)}" height="${plotH}" fill="#059669" fill-opacity="0.09"/>`
      : "";

    const yTicks = [0, 0.25, 0.5, 0.75, 1].map(f => {
      const val = minV + f * span;
      const y = gy(val);
      return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#E2E8F0"/>
              <text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#64748B">${val.toFixed(1)}</text>`;
    }).join("");

    const xTicks = [0, 20, 40, 60, 80, 100].map(pct => {
      const x = gx(pct / 2);
      return `<text x="${x}" y="${H - 22}" text-anchor="middle" font-size="11" fill="#64748B">${pct}%</text>`;
    }).join("");

    const legend = CONDITIONS.map((c, i) =>
      `<g transform="translate(${padL + i * 130}, ${H - 6})">
         <line x1="0" y1="-4" x2="20" y2="-4" stroke="${COLORS[c]}" stroke-width="3"/>
         <text x="26" y="0" font-size="12" font-weight="700" fill="${COLORS[c]}">${c}</text>
       </g>`
    ).join("");

    return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHTML(signal)}">
      ${yTicks}${hipZone}
      <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="#94A3B8"/>
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#94A3B8"/>
      ${bands}${lines}${xTicks}${legend}
    </svg>`;
  }

  function buildUnstableScatterSVG(unst) {
    const allPts = CONDITIONS.flatMap(c => unst[c].points.map(p => ({ ...p, cond: c })));
    const gpsVals = validNums(allPts.map(p => p.gps));
    if (!gpsVals.length) return "";
    const minG = Math.min(...gpsVals) - 0.5;
    const maxG = Math.max(...gpsVals) + 0.5;
    const span = Math.max(maxG - minG, 1);
    const W = 720, H = 220, padL = 48, padR = 20, padT = 20, padB = 34;
    const colX = { Baseline: 150, Verbal: 360, VR: 570 };
    const gy = v => padT + (H - padT - padB) - ((v - minG) / span) * (H - padT - padB);

    const dots = allPts.map((p, idx) => {
      if (p.gps == null) return "";
      const jitter = ((idx * 37) % 80) - 40;
      const cx = colX[p.cond] + jitter;
      const cy = gy(p.gps);
      const fill = p.unstable ? "#EF4444" : COLORS[p.cond];
      const r = p.unstable ? 5.5 : 4;
      return `<circle cx="${cx}" cy="${cy.toFixed(1)}" r="${r}" fill="${fill}" fill-opacity="${p.unstable ? 0.95 : 0.65}" stroke="#fff" stroke-width="1"/>`;
    }).join("");

    const labels = CONDITIONS.map(c =>
      `<text x="${colX[c]}" y="${H - 10}" text-anchor="middle" font-size="12" font-weight="700" fill="${COLORS[c]}">${c} (${unst[c].unstable}/${unst[c].total})</text>`
    ).join("");

    return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Unstable Steps Scatter">
      <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#CBD5E1"/>
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="#CBD5E1"/>
      <text x="6" y="${padT + 8}" font-size="11" fill="#64748B">GPS ${maxG.toFixed(1)}</text>
      <text x="6" y="${H - padB}" font-size="11" fill="#64748B">${minG.toFixed(1)}</text>
      ${dots}${labels}
    </svg>`;
  }

  function downloadFile(filename, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1200);
  }

  function exportCSVTable(pid) {

        : L === "en"
        ? "CP Gait & Metrics Guide:\n• Baseline = normal walking; Verbal = spoken cues; VR = virtual avatar feedback.\n• GPS = overall gait deviation; GVS = single-joint deviation. Lower values mean closer-to-reference motion.\n• ICF codes: b770 (gait pattern), d450 (walking)."
        : "Справка по ДЦП и показателям походки:\n• Baseline — обычная ходьба; Verbal — словесная подсказка; VR — виртуальная обратная связь.\n• GPS — общий индекс отклонения походки от эталона; GVS — отклонение конкретного сустава (таз, бедро, колено, голеностоп). Чем ниже значение, тем ближе шаг к эталону.\n• Коды МКФ: b770 (функции паттерна походки) и d450 (ходьба).";
      return { text: txt, targetTab: hasPatient ? "gait" : null };
    }

    if (quickIdx === 4 || (quickIdx === null && /выписк|анализ|027|чеклист|үзінді|талдау|подготов|discharge|checklist|test|document|prepare/.test(ql))) {
      const txt = L === "kk"
        ? "3-бөлімдегі («Клиникалар мен чеклист») авто-чеклистте бағыт мақсатын және соңғы жылдағы операцияны таңдаңыз — жүйе 027/у толық үзіндісі қажет пе екенін автоматты шығарады."
        : L === "en"
        ? "Open Tab 3 ('Clinics & Checklist') and select your route plus surgery history to automatically check if Form 027/u is required."
        : "Откройте вкладку 3 («Клиники и чеклист»): выберите цель маршрута и наличие операций — система автоматически ответит, нужна ли полная выписка 027/у, и покажет справочный список анализов.";
      return { text: txt, targetTab: hasPatient ? "clinics" : null };
    }

    if (quickIdx === 5 || (quickIdx === null && /клиник|центр|поликлиник|емхана|орталық|город|регион|област|қала|облыс|семей|астан|алмат|шымкент|clinic|center|centre|region/.test(ql))) {
      const txt = L === "kk"
        ? "3-бөлімдегі навигаторда Қазақстанның барлық 20 өңірі мен қаласы бойынша оңалту орталықтарын таңдауға болады."
        : L === "en"
        ? "Tab 3's Clinic Navigator covers all 20 cities and regions of Kazakhstan with filters by neurorehabilitation, LFK, and VR."
        : "На вкладке 3 («Клиники и чеклист») есть навигатор центров реабилитации по всем 20 городам и областям Казахстана с фильтрами по профилю.";
      return { text: txt, targetTab: hasPatient ? "clinics" : null };
    }

    if (quickIdx === null && /отч[её]т|скача|damumed|fhir|pdf|есеп|жүкте|report|download|export/.test(ql)) {
      const txt = L === "kk"
        ? "4-бөлімде («Есеп және Damumed») HTML/PDF есебін, CSV кестесін жүктеп, дәрігер режимінде Damumed хаттамасы мен HL7 FHIR JSON алуға болады."
        : L === "en"
        ? "Go to Tab 4 ('Report & Damumed') to download the HTML/PDF report, CSV table, copy the Damumed clinical note, or download HL7 FHIR JSON."
        : "Откройте вкладку 4 («Отчёт и Damumed»): там можно скачать отчёт врача (HTML для печати в PDF), таблицу CSV, а в режиме Врача — скопировать протокол для Damumed и скачать HL7 FHIR JSON.";
      return { text: txt, targetTab: hasPatient ? "report" : null };
    }

    if (quickIdx === null && /график|крив|сустав|таблиц|қисық|буын|кесте|chart|curve|graph|table/.test(ql) && !/колен|таз|голеностоп|бедр|момент|тізе|жамбас|тобық|сан/.test(ql)) {
      const txt = L === "kk"
        ? "1-бөлімде («Жүріс және графиктер») 5 сигналдың кез келгенін таңдап, 0–100% цикл қисығын (±1 SD) көруге болады."
        : L === "en"
        ? "In Tab 1 ('Gait & Charts'), use the signal dropdown to view 0–100% gait cycle waveforms (±1 SD) for hip, pelvis, knee, ankle angles, and hip moment."
        : "На вкладке 1 («Походка и графики») можно выбрать любой из 5 сигналов и увидеть наложенные кривые 0–100% цикла шага с коридором ±1 SD.";
      return { text: txt, targetTab: hasPatient ? "gait" : null };
    }

    const jointReply = (metricKey, nRu, nKk, nEn) => {
      if (!hasPatient) return { text: noDataHint };
      const st = getPatientStats(pid);
      const b = st.Baseline.metrics[metricKey], v = st.Verbal.metrics[metricKey], r = st.VR.metrics[metricKey];
      const lbl = L === "kk" ? nKk : L === "en" ? nEn : nRu;
      return {
        text: `${lbl} (${pid}):\n• Baseline: ${fmt(b.mean)} (n=${b.n})\n• Verbal: ${fmt(v.mean)} | Δ ${fmtDelta(v.mean, b.mean)} (n=${v.n})\n• VR: ${fmt(r.mean)} | Δ ${fmtDelta(r.mean, b.mean)} (n=${r.n})`,
        targetTab: "gait"
      };
    };

    if (/колен|тізе|knee|asagk/.test(ql)) return jointReply("GVS_aSagK", "GVS колена", "Тізе GVS", "Knee GVS");
    if (/таз|жамбас|pelv|asagp/.test(ql)) return jointReply("GVS_aSagP", "GVS таза", "Жамбас GVS", "Pelvis GVS");
    if (/голеностоп|тобық|ankl|asaga/.test(ql)) return jointReply("GVS_aSagA", "GVS голеностопа", "Тобық GVS", "Ankle GVS");
    if (/мин.*угол|aminsagh|разгиб/.test(ql)) return jointReply("aMinSagH", "Мин. угол бедра", "Мин. сан бұрышы", "Min hip angle");
    if (/момент|переход|pctmzero|кинетик|msagh/.test(ql)) return jointReply("pctmZeroStSagH", "Момент перехода", "Өту сәті", "Hip moment transition");
    if (/бедр|сан|hip|asagh/.test(ql)) return jointReply("GVS_aSagH", "GVS бедра", "Сан GVS", "Hip GVS");

    if (/вес|рост|сторон|цикл|ног|пропуск|nan|дубликат|качество|салмақ|бой|тарап|аяқ|сапа|weight|height|side|cycle|leg|quality/.test(ql)) {
      if (!hasPatient) return { text: noDataHint };
      const st = getPatientStats(pid);
      const f = st.Baseline.rows[0] || st.Verbal.rows[0] || st.VR.rows[0];
      const allRows = [...st.Baseline.rows, ...st.Verbal.rows, ...st.VR.rows];
      let nanC = 0;
      for (const r of allRows) for (const m of METRICS) if (r[m] == null) nanC++;
      const dupC = st.Baseline.rows.length - new Set(st.Baseline.rows.map(r => JSON.stringify(r))).size;
      return { text: `${pid}: ${t("side")} ${f.side}, ${t("weight")} ${fmt(f.weight, 1)} ${t("kg")}, ${t("height")} ${fmt(f.height, 2)} ${t("m")}, ${t("legLength")} ${fmt(f.LegLength, 3)} ${t("m")}.\n${t("cycles")}: ${st.Baseline.rows.length} / ${st.Verbal.rows.length} / ${st.VR.rows.length}.\nNaN: ${nanC}, Baseline duplicates: ${dupC}.`, targetTab: "gait" };
    }

    if (/мдг|мдт|невролог|психолог|алгоритм|маршрут|mdg|neurolog|psycholog/.test(ql)) {
      if (!hasPatient) return { text: noDataHint };
      const m = buildMDGRoute(pid);
      return { text: m.emergency ? t("mdgEmergency") : `${t("mdgStep1")}: ${m.step1}\n${t("mdgStep2")}: ${m.step2}\n${t("mdgCaution")}: ${m.caution}`, targetTab: "summary", danger: m.emergency };
    }

    if (/мкф|хфж|b770|d450|icf/.test(ql)) return { text: t("icfNote"), targetTab: hasPatient ? "summary" : null };

    if (/ml|модел|точност|когорт|процентил|groupkfold|accuracy|дәлдік|когорта|percentile/.test(ql)) {
      if (!hasPatient) return { text: noDataHint };
      const ml = runGroupKFoldML();
      const cohort = computeCohortStats();
      const vp = cohort.percentileFor("Verbal", pid), rp = cohort.percentileFor("VR", pid);
      const txt = ml
        ? `${t("mlEngineTitle")} (${ml.folds} folds, ${ml.patientsCount} patients):\n• ${ml.models[0].name}: Accuracy ${(ml.models[0].accMean * 100).toFixed(1)}% ± ${(ml.models[0].accSd * 100).toFixed(1)}%, Macro-F1 ${ml.models[0].f1Mean.toFixed(3)}\n• ${t("mlRandomBase")}` +
          (state.user?.role === "doctor" ? `\n• ${pid} percentiles: Verbal ${vp ?? "—"}%, VR ${rp ?? "—"}%.` : "")
        : t("noData");
      return { text: txt, targetTab: state.user?.role === "doctor" ? "ml" : "summary" };
    }

    // Expanded real-user questions
    if (/что\s+такое\s+qadam|о\s+сайте|о\s+проекте|зачем\s+нужен|для\s+чего|бесплатн|сколько\s+стоит|не\s+үшін|жоба\s+туралы|тегін|about\s+qadam|what\s+is\s+qadam|free|cost/.test(ql)) {
      const txt = L === "kk"
        ? "QadamCare — БЦС (ДЦП) бар балалардың жүрісін биомеханикалық CSV деректері арқылы талдайтын көмекші веб-жүйе. Ол дәрігер мен ата-анаға Verbal (сөздік нұсқау) немесе VR қайсысы тиімдірек екенін салыстыруға, компенсацияны байқауға және оңалтуға дайындалуға көмектеседі. Прототип толығымен тегін."
        : L === "en"
        ? "QadamCare is an auxiliary web platform for analyzing gait biomechanics in children with CP from CSV sensor data. It helps doctors and parents compare Verbal cueing vs VR feedback, spot compensations, and prepare rehabilitation documents. The prototype is completely free."
        : "QadamCare — вспомогательный сервис для анализа походки детей с ДЦП по данным биомеханики (CSV). Он помогает врачу и родителям сравнить обычную ходьбу, словесную подсказку (Verbal) и VR, вовремя заметить компенсации в суставах и подготовить документы к реабилитации. Прототип полностью бесплатный.";
      return { text: txt };
    }

    if (/безопасн|конфиденц|приват|иин|фио|данные\s+куда|сохраня|құпия|жсн|қауіпсіз|privacy|safe|personal|gdpr|security/.test(ql)) {
      const txt = L === "kk"
        ? "Құпиялылық: QadamCare нақты аты-жөн мен ЖСН сұрамайды, тек иесіздендірілген кодтармен (мысалы, s61520_1) жұмыс істейді. CSV файлдары сыртқы серверге жіберілмейді — тек сіздің браузеріңізде өңделеді. Ата-ана тек өз баласының картасын көреді."
        : L === "en"
        ? "Privacy: QadamCare never asks for real names or national IDs—only anonymized codes (e.g., s61520_1). CSV files are processed locally inside your browser without uploading to external servers. Parents only see their linked child's card."
        : "Конфиденциальность: QadamCare не запрашивает реальные ФИО и ИИН и работает только с обезличенными кодами (например, s61520_1). Загруженные CSV обрабатываются локально прямо в браузере и никуда не отправляются. Родитель видит только карту своего ребёнка.";
      return { text: txt };
    }

    if (/квот|осмс|гобмп|портал|направлен|бесплатн.*реабил|мәмс|тмккк|жолдама|quota|insurance|referral/.test(ql)) {
      const txt = L === "kk"
        ? "Қазақстанда МӘМС/ТМККК арқылы оңалтуға жолдама алу үшін тіркелген емханадағы педиатрға немесе неврологқа жүгініңіз. Дәрігер МДТ шешімімен порталға (Бюро госпитализации) тіркейді. 3-бөлімдегі авто-чеклист 027/у үзіндісі мен негізгі құжаттарды алдын ала дайындауға көмектеседі."
        : L === "en"
        ? "In Kazakhstan, public rehabilitation under OSMS/GOBMP starts with your clinic's pediatrician or neurologist, who submits a referral through the hospitalization portal. Use Tab 3's Auto-Checklist to prepare Form 027/u and required documents."
        : "В Казахстане реабилитация по ОСМС/ГОБМП оформляется через педиатра или невролога в поликлинике по месту прикрепления (направление через портал). Авто-чеклист на вкладке 3 подскажет, нужна ли полная выписка 027/у и какие документы подготовить к приёму.";
      return { text: txt, targetTab: hasPatient ? "clinics" : null };
    }

    if (/сколько\s+длит|длительност|как\s+часто|сколько\s+занят|вред.*vr|опасн.*vr|шлем|уста|қанша\s+уақыт|жиі|зиян|how\s+long|how\s+often|vr\s+safe|headset/.test(ql)) {
      const txt = L === "kk"
        ? "VR-жаттығулардың ұзақтығы мен жиілігін тек баланың жасына, спастика деңгейіне және психолог бағасына қарап оңалту дәрігері белгілейді. Әдетте бастапқы кезеңде қысқа бейімделу сессиялары (5–10 минут) қолданылады. Бас айналу, үрей немесе шаршау болса, жаттығуды дереу тоқтату керек."
        : L === "en"
        ? "The duration and frequency of VR sessions are set strictly by your rehabilitation doctor based on age, spasticity, and psychological readiness. Typically, adaptation starts with short 5–10 minute supervised sessions and stops immediately if dizziness or fatigue occurs."
        : "Длительность и частоту VR-занятий всегда определяет врач-реабилитолог с учётом возраста, спастичности и готовности ребёнка. Обычно начинают с коротких адаптационных сессий (5–10 минут) под контролем специалиста; при головокружении, тревоге или усталости занятие сразу прекращают.";
      return { text: txt, targetTab: hasPatient ? "summary" : null };
    }

    if (/ку\s*лев|ku\s*leuven|источник|откуда\s+данн|29\s+пациент|лиценз|дереккөз|source|dataset\s+from|license/.test(ql)) {
      const txt = L === "kk"
        ? "Зерттеу дереккөзі: Бельгиядағы KU Leuven университетінің ашық иесіздендірілген датасеті (DOI: 10.48804/JUNNWW, лицензия CC-BY-NC-SA-4.0), БЦС бар 29 баланың жүріс циклдері (Baseline, Verbal, VR)."
        : L === "en"
        ? "Data source: Open anonymized KU Leuven dataset (DOI: 10.48804/JUNNWW, license CC-BY-NC-SA-4.0), containing gait cycles of 29 children with CP across Baseline, Verbal, and VR conditions."
        : "Источник данных: открытый обезличенный датасет университета KU Leuven (DOI: 10.48804/JUNNWW, лицензия CC-BY-NC-SA-4.0), содержащий циклы походки 29 детей с ДЦП в условиях Baseline, Verbal и VR.";
      return { text: txt, targetTab: hasPatient ? "report" : null };
    }

    if (/забыл.*парол|сброс.*парол|поменя.*парол|құпиясөз.*ұмыт|forgot\s+password|reset\s+password/.test(ql)) {
      const txt = L === "kk"
        ? "Демо-нұсқада аккаунттар браузердің жергілікті жадында сақталады. Құпиясөзді ұмытсаңыз, «Тіркелу» арқылы жаңа логинмен аккаунт құрыңыз немесе «Демо: Дәрігер / Ата-ана» арқылы 1 басумен кіріңіз."
        : L === "en"
        ? "In this demo version, accounts are stored locally in your browser. If you forgot your password, simply register a new username or use the 1-click Demo Doctor / Parent login."
        : "В демо-версии аккаунты хранятся локально в браузере. Если забыли пароль — просто зарегистрируйте новый логин или используйте быстрый «Демо: Врач» / «Демо: Родитель».";
      return { text: txt };
    }

    if (/спасиб|благодар|рахмет|көп\s*рахмет|thank|thx/.test(ql)) {
      const txt = L === "kk"
        ? "Оқасы жоқ! Тағы сұрақтарыңыз болса, кез келген уақытта жаза беріңіз."
        : L === "en"
        ? "You're welcome! Feel free to ask anytime if you need help with QadamCare."
        : "Пожалуйста! Если появятся ещё вопросы по сайту, показателям походки или документам — всегда рад помочь.";
      return { text: txt };
    }

    if (/пока|до\s*свидан|сау\s*бол|bye|goodbye/.test(ql)) {
      const txt = L === "kk"
        ? "Сау болыңыз! Балаңызға зор денсаулық тілеймін."
        : L === "en"
        ? "Goodbye! Wishing you and your family good health."
        : "До свидания! Берегите здоровье, при необходимости чат всегда под рукой.";
      return { text: txt };
    }

    const menuText = u('menuShort');
    return { text: menuText };
  }

  /* =========================================================================
     10. RENDERING UI (TOPBAR, LANDING, AUTH MODAL, WORKSPACE, 5 TABS)
     ========================================================================= */
  function renderCoreApp() {
    document.documentElement.lang = state.lang;
    document.documentElement.classList.toggle("large-font", state.largeFont);
    $("globalLargeFont").checked = state.largeFont;
    $("lblGlobalLargeFont").textContent = t("largeFont");
    $("ethicsBannerText").textContent = t("ethicsBanner");

    document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === state.lang));

    const loggedIn = !!state.user;
    $("topbarAuthBtns").classList.toggle("hidden", loggedIn);
    $("topbarUserArea").classList.toggle("hidden", !loggedIn);
    $("openLoginBtn").textContent = t("btnLogin");
    $("openRegisterBtn").textContent = t("btnRegister");
    $("logoutBtn").textContent = t("btnLogout");
    if (loggedIn) {
      const roleLbl = state.user.role === "doctor" ? t("roleDoctor") : t("roleParent");
      $("userBadge").textContent = `${state.user.username} · ${roleLbl}`;
    }

    $("landingSection").classList.toggle("hidden", loggedIn);
    $("appSection").classList.toggle("hidden", !loggedIn);

    renderLanding();
    renderAuthModalTexts();
    if (loggedIn) {
      renderWorkspaceHeader();
      renderTabContent();
    }
    renderAIChat();
  }

  function renderLanding() {
    $("heroBadge").textContent = t("heroBadge");
    $("heroTitle").textContent = t("heroTitle");
    $("heroSub").textContent = t("heroSub");
    $("heroQuickDoctorBtn").textContent = t("heroQuickDoctor");
    $("heroQuickParentBtn").textContent = t("heroQuickParent");
    $("heroPreviewTitle").textContent = t("heroPreviewTitle");

    $("landingFeatures").innerHTML = t("features").map(f =>
      `<div class="card card-hover" style="margin-bottom:0;">
        <div style="font-size:1.75rem;margin-bottom:0.4rem;">${f.icon}</div>
        <h3>${escapeHTML(f.title)}</h3>
        <p class="muted" style="margin:0;">${escapeHTML(f.desc)}</p>
      </div>`
    ).join("");
  }

  function renderAuthModalTexts() {
    const isLogin = state.authMode === "login";
    $("authModalTitle").textContent = isLogin ? t("authLoginTitle") : t("authRegTitle");
    $("switchLoginBtn").textContent = t("btnLogin");
    $("switchRegisterBtn").textContent = t("btnRegister");
    $("switchLoginBtn").classList.toggle("active", isLogin);
    $("switchRegisterBtn").classList.toggle("active", !isLogin);
    $("loginForm").classList.toggle("hidden", !isLogin);
    $("registerForm").classList.toggle("hidden", isLogin);

    $("lblLoginUser").textContent = t("lblLoginUser");
    $("lblLoginPass").textContent = t("lblLoginPass");
    $("btnSubmitLogin").textContent = t("submitLogin");
    $("modalDemoDocBtn").textContent = t("heroQuickDoctor");
    $("modalDemoParentBtn").textContent = t("heroQuickParent");
    $("damumedAuthStub").textContent = t("damumedStub");

    $("lblRegUser").textContent = t("lblRegUser");
    $("lblRegPass").textContent = t("lblRegPass");
    $("lblRegRole").textContent = t("lblRegRole");
    $("optRoleDoc").textContent = t("roleDoctor");
    $("optRoleParent").textContent = t("roleParent");
    $("lblRegSpec").textContent = t("regSpec");
    $("lblRegCity").textContent = t("regCity");
    $("lblRegLargeFont").textContent = t("regLargeFont");
    $("lblRegEthics").textContent = t("regEthics");
    $("btnSubmitRegister").textContent = t("submitRegister");

    const curSpec = $("regSpec").value;
    $("regSpec").innerHTML = t("specs").map((s, i) => `<option value="${i}">${escapeHTML(s)}</option>`).join("");
    if (curSpec) $("regSpec").value = curSpec;

    const curCity = $("regCity").value || "abay";
    $("regCity").innerHTML = REGIONS_KZ.map(r => `<option value="${r.id}">${escapeHTML(r[state.lang])}</option>`).join("");
    $("regCity").value = curCity;

    const isDoc = $("regRole").value === "doctor";
    $("regDoctorFields").classList.toggle("hidden", !isDoc);
    $("regParentFields").classList.toggle("hidden", isDoc);
  }

  function renderCoreHeader() {
    $("uploadTitle").textContent = t("uploadTitle");
    $("uploadDesc").textContent = t("uploadDesc");
    $("loadDemoDataBtn").textContent = t("loadDemoBtn");
    $("toggleUploadBtn").classList.toggle("hidden", !state.dataLoaded);
    $("toggleUploadBtn").textContent = state.showUpload ? t("toggleUploadHide") : t("toggleUploadShow");
    $("uploadInputsWrap").classList.toggle("hidden", !state.showUpload);
    if (!state.dataLoaded) $("uploadStatus").textContent = t("uploadWaiting");

    $("workspace").classList.toggle("hidden", !state.dataLoaded);
    if (!state.dataLoaded) return;

    const isParent = state.user.role === "parent";
    const needsLink = isParent && (!state.selectedPatient || !state.patients.includes(state.selectedPatient));

    $("parentLinkCard").classList.toggle("hidden", !needsLink);
    $("patientWorkspaceInner").classList.toggle("hidden", needsLink);

    if (needsLink) {
      $("parentLinkTitle").textContent = t("parentLinkTitle");
      $("parentLinkDesc").textContent = t("parentLinkDesc");
      $("lblParentLinkSelect").textContent = t("lblParentLinkSelect");
      $("btnConfirmParentLink").textContent = t("btnConfirmParentLink");
      $("parentLinkSelect").innerHTML = state.patients.map(p => `<option value="${escapeHTML(p)}">${escapeHTML(p)}</option>`).join("");
      return;
    }

    $("lblPatientSelect").textContent = t("patientLabel");
    $("patientSelect").classList.toggle("hidden", isParent);
    $("parentFixedRow").classList.toggle("hidden", !isParent);

    if (isParent) {
      $("parentFixedPatient").textContent = state.selectedPatient;
      $("btnUnlinkParentCard").textContent = t("btnUnlinkParentCard");
    } else {
      $("patientSelect").innerHTML = state.patients.map(p => `<option value="${escapeHTML(p)}">${escapeHTML(p)}</option>`).join("");
      $("patientSelect").value = state.selectedPatient;
    }

    const pid = state.selectedPatient;
    const st = getPatientStats(pid);
    const f = st.Baseline.rows[0] || st.Verbal.rows[0] || st.VR.rows[0];
    $("patientMeta").innerHTML = [
      `${t("side")}: ${escapeHTML(f.side)}`,
      `${t("weight")}: ${fmt(f.weight, 1)} ${t("kg")}`,
      `${t("height")}: ${fmt(f.height, 2)} ${t("m")}`,
      `${t("legLength")}: ${fmt(f.LegLength, 3)} ${t("m")}`,
      `${t("cycles")}: ${st.Baseline.rows.length} / ${st.Verbal.rows.length} / ${st.VR.rows.length}`
    ].map(x => `<span class="badge badge-muted">${x}</span>`).join("");

    const allRows = [...st.Baseline.rows, ...st.Verbal.rows, ...st.VR.rows];
    let nanC = 0;
    for (const r of allRows) for (const m of METRICS) if (r[m] == null) nanC++;
    const dupC = st.Baseline.rows.length - new Set(st.Baseline.rows.map(r => JSON.stringify(r))).size;

    $("dataQualityBadge").innerHTML = (nanC > 0 || dupC > 0)
      ? `<div class="badge badge-warn" style="border-radius:10px;padding:0.4rem 0.7rem;white-space:normal;">⚠️ ${escapeHTML(t("dqWarn").replace("{nan}", nanC).replace("{dup}", dupC))}</div>`
      : `<div class="badge badge-vr">✓ ${escapeHTML(t("dqClean"))}</div>`;

    const tabOrder = isParent ? ["gait", "video", "summary", "clinics", "report"] : ["gait", "video", "summary", "clinics", "report", "ml"];
    if (!tabOrder.includes(state.activeTab)) state.activeTab = "gait";

    $("mainTabs").innerHTML = tabOrder.map(id =>
      `<button type="button" class="tab-btn ${state.activeTab === id ? "active" : ""}" data-tab="${id}">${escapeHTML(t("tabs." + id))}</button>`
    ).join("");
    $("mainTabs").querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.activeTab = btn.dataset.tab;
        renderWorkspaceHeader();
        renderTabContent();
      });
    });
  }

  function renderCoreTab() {
    if (!state.dataLoaded || !state.selectedPatient) return;
    const el = $("tabContent");
    const pid = state.selectedPatient;
    const isParent = state.user.role === "parent";

    if (state.activeTab === "gait") {
      const st = getPatientStats(pid);
      const comps = detectCompensations(pid);
      const kpiMetrics = ["GPS_a", "GVS_aSagH", "aMinSagH", "pctmZeroStSagH"];
      const kpisHtml = kpiMetrics.map(m => {
        const b = st.Baseline.metrics[m], v = st.Verbal.metrics[m], r = st.VR.metrics[m];
        return `<div class="kpi-card">
          <div class="kpi-title">${escapeHTML(t("metrics." + m))}</div>
          <div class="kpi-val">${fmt(b.mean)}</div>
          <div class="kpi-sub">
            Baseline: n=${b.n}<br>
            <span style="color:var(--verbal);font-weight:700;">Verbal:</span> Δ ${fmtDelta(v.mean, b.mean)} (n=${v.n})<br>
            <span style="color:var(--vr);font-weight:700;">VR:</span> Δ ${fmtDelta(r.mean, b.mean)} (n=${r.n})
          </div>
        </div>`;
      }).join("");

      const compHtml = comps.length
        ? `<div class="card card-warn"><strong>⚠️ ${escapeHTML(t("compWarn"))}</strong> ${escapeHTML(comps.map(c => `${c.cond}: ${t("metrics." + c.metric)} (+${c.pct.toFixed(1)}%)`).join("; "))}</div>`
        : `<div class="card card-success">✓ ${escapeHTML(t("compNone"))}</div>`;

      const tableOrParent = isParent
        ? `<div class="card">
             <h3>${escapeHTML(t("parentSimpleTitle"))}</h3>
             ${summaryMarkup(generateSummaryText(pid))}
             <h4>${escapeHTML(t("parentQuestionsTitle"))}</h4>
             <ul>${t("parentQs").map(q => `<li>${escapeHTML(q)}</li>`).join("")}</ul>
           </div>`
        : `<div class="card">
             <h3>${escapeHTML(t("tableTitle"))}</h3>
             <div class="table-wrap">
               <table>
                 <thead><tr><th>Metric</th><th>Baseline</th><th>Verbal (Δ, p)</th><th>VR (Δ, p)</th></tr></thead>
                 <tbody>
                   ${METRICS.map(m => {
                     const b = st.Baseline.metrics[m], v = st.Verbal.metrics[m], r = st.VR.metrics[m];
                     const pv = mannWhitneyP(b.vals, v.vals), pr = mannWhitneyP(b.vals, r.vals);
                     return `<tr>
                       <td><strong>${escapeHTML(t("metrics." + m))}</strong></td>
                       <td>${fmt(b.mean)} ± ${fmt(b.sd)} <span class="muted">(n=${b.n})</span></td>
                       <td>${fmt(v.mean)} ± ${fmt(v.sd)}<br><small>Δ ${fmtDelta(v.mean, b.mean)} · p=${pv == null ? "—" : pv.toFixed(3)} · n=${v.n}</small></td>
                       <td>${fmt(r.mean)} ± ${fmt(r.sd)}<br><small>Δ ${fmtDelta(r.mean, b.mean)} · p=${pr == null ? "—" : pr.toFixed(3)} · n=${r.n}</small></td>
                     </tr>`;
                   }).join("")}
                 </tbody>
               </table>
             </div>
           </div>`;

      el.innerHTML = `
        <div class="card"><h3>${escapeHTML(t("kpiSection"))}</h3><div class="grid-4">${kpisHtml}</div></div>
        ${compHtml}
        <div class="card">
          <div class="row-flex" style="justify-content:space-between;margin-bottom:0.65rem;">
            <h3 style="margin:0;">${escapeHTML(t("waveformTitle"))}</h3>
            <div style="min-width:260px;">
              <select id="signalSelect">${SIGNALS.map(s => `<option value="${s}" ${s === state.selectedSignal ? "selected" : ""}>${escapeHTML(t("signals." + s))}</option>`).join("")}</select>
            </div>
          </div>
          ${state.selectedSignal === "aSagH" ? `<p class="muted">${escapeHTML(t("hipZoneNote"))}</p>` : ""}

        ${tableOrParent}

      $("signalSelect").addEventListener("change", e => { state.selectedSignal = e.target.value; renderTabContent(); });
      return;
    }

    if (state.activeTab === "summary") {
      const unst = detectUnstableSteps(pid);
      const cohort = computeCohortStats();
      const pVerb = cohort.percentileFor("Verbal", pid);
      const pVR = cohort.percentileFor("VR", pid);
      const mdg = buildMDGRoute(pid);
      const summaryText = generateSummaryText(pid);

      el.innerHTML = `
        <div class="card">
          <div class="row-flex" style="justify-content:space-between;">
            <h3 style="margin:0;">${escapeHTML(t("summaryTitle"))}</h3>

          </div>

        </div>

        <div class="card">
          <h3>${escapeHTML(t("mdgTitle"))}</h3>
          <div class="grid-2" style="margin-bottom:0.9rem;">

              <select id="mdgNeuroSel">${t("neuroOpts").map((o, i) => `<option value="${i}" ${i === Number(state.neuroStatus) ? "selected" : ""}>${escapeHTML(o)}</option>`).join("")}</select>

            <div>
              <label class="field-label" for="mdgPsychSel">${escapeHTML(t("lblPsych"))}</label>
              <select id="mdgPsychSel">${t("psychOpts").map((o, i) => `<option value="${i}" ${i === Number(state.psychStatus) ? "selected" : ""}>${escapeHTML(o)}</option>`).join("")}</select>
            </div>
          </div>
          ${mdg.emergency
            ? `<div class="card card-danger" style="margin:0;"><strong>🚨 ${escapeHTML(t("mdgEmergency"))}</strong></div>`

                 <div class="kpi-card" style="background:var(--warn-bg);border-color:#FCD34D;"><div class="kpi-title" style="color:var(--warn-text);">${escapeHTML(t("mdgCaution"))}</div><p style="margin:0.35rem 0 0;">${escapeHTML(mdg.caution)}</p></div>
               </div>`}
        </div>

        <div class="card">
          <h3>${escapeHTML(t("unstableTitle"))}</h3>
          <p class="muted">${escapeHTML(t("unstablePct"))}</p>
          <div class="grid-3" style="margin-bottom:0.85rem;">
            ${CONDITIONS.map(c => `<div class="kpi-card"><div class="kpi-title" style="color:${COLORS[c]}">${c}</div><div class="kpi-val">${unst[c].pct.toFixed(1)}%</div><div class="kpi-sub">${unst[c].unstable} / ${unst[c].total}</div></div>`).join("")}
          </div>
          ${buildUnstableScatterSVG(unst)}
          ${!isParent ? `
          <div class="badge badge-primary" style="margin-top:0.75rem;border-radius:10px;padding:0.5rem 0.8rem;white-space:normal;">
            ${escapeHTML(t("cohortPctLabel").replace("{n}", cohort.total))}: Verbal — ${pVerb ?? "—"}%, VR — ${pVR ?? "—"}%
          </div>` : ""}
        </div>
      `;

      $("mdgNeuroSel").addEventListener("change", e => { state.neuroStatus = Number(e.target.value); saveMDGForSubject(pid); renderTabContent(); });
      $("mdgPsychSel").addEventListener("change", e => { state.psychStatus = Number(e.target.value); saveMDGForSubject(pid); renderTabContent(); });
      $("btnSpeakSummary").addEventListener("click", () => {
        if (!("speechSynthesis" in window)) { showToast("SpeechSynthesis not supported"); return; }
        if (state.speaking) {
          window.speechSynthesis.cancel();
          state.speaking = false;
          renderTabContent();
          return;
        }
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(summaryText);
        u.lang = state.lang === "kk" ? "kk-KZ" : (state.lang === "en" ? "en-US" : "ru-RU");
        u.onend = () => { state.speaking = false; renderTabContent(); };
        u.onerror = () => { state.speaking = false; renderTabContent(); };
        state.speaking = true;
        renderTabContent();
        window.speechSynthesis.speak(u);
      });
      return;
    }

    if (state.activeTab === "clinics") {
      const req027 = (state.routeGoal === 2) || state.hadSurgery || (state.routeGoal === 1 && state.visitType === 0);
      const docKeys = ["referral", "protocol", "neurologist"];
      if (state.routeGoal !== 0) docKeys.push("pediatrician", "blood", "urine", "epid");
      if (req027) docKeys.push("form027");
      if (state.hadSurgery) docKeys.push("surg");
      if (state.visitType === 1) docKeys.push("prev");

      const matches = CLINICS_DB.filter(c =>
        (state.clinicRegion === "all" || c.region === state.clinicRegion) &&
        (state.clinicProfile === "all" || (state.clinicProfile !== "vr" && c.profiles.includes(state.clinicProfile)))
      );

      el.innerHTML = `
        <div class="card">
          <h3>${escapeHTML(t("checklistTitle"))}</h3>
          <div class="grid-2">
            <div>
              <label class="field-label" for="routeGoalSel">${escapeHTML(t("lblRoute"))}</label>
              <select id="routeGoalSel">${t("routeOpts").map((o, i) => `<option value="${i}" ${i === state.routeGoal ? "selected" : ""}>${escapeHTML(o)}</option>`).join("")}</select>
            </div>
            <div>
              <label class="field-label" for="visitTypeSel">${escapeHTML(t("lblVisit"))}</label>
              <select id="visitTypeSel">${t("visitOpts").map((o, i) => `<option value="${i}" ${i === state.visitType ? "selected" : ""}>${escapeHTML(o)}</option>`).join("")}</select>
            </div>
          </div>
          <label class="checkbox-row">
            <input type="checkbox" id="hadSurgeryChk" ${state.hadSurgery ? "checked" : ""}>
            <span>${escapeHTML(t("lblSurgery"))}</span>
          </label>
          <div class="card ${req027 ? "card-warn" : "card-success"}" style="margin:0.85rem 0;">

          <div class="grid-2">
            ${docKeys.map(k => `<label class="checkbox-row" style="margin-top:0.25rem;"><input type="checkbox" class="doc-chk" data-dk="${k}" ${state.checkedDocs[k] ? "checked" : ""}><span>${escapeHTML(t("docs." + k))}</span></label>`).join("")}
